    <title>鳥嶼國小英語學習護照v1.9</title>
    
    <!-- 載入 Tailwind CSS (樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 載入 Babel (讓瀏覽器看得懂 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 載入 Firebase (帳號登入 + 學習紀錄資料庫) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <style>
        /* 自定義動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-10%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }

<body class="bg-slate-50 text-slate-800 select-none">

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =====================================================================
        // Firebase 設定區
        // 請到 https://console.firebase.google.com 建立一個新專案，
        // 開啟 Authentication(電子郵件/密碼) 與 Firestore Database，
        // 再到「專案設定 -> 一般 -> 您的應用程式」新增一個「網頁應用程式」，
        // 把產生出來的設定值貼到下面取代佔位文字。
        // 詳細步驟請參考隨附的 SETUP_GUIDE.md
        // =====================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyBZIPCZsFLR2ipwXdV_NKD8QISBMe19sMY",
          authDomain: "nypspassport.firebaseapp.com",
          projectId: "nypspassport",
          storageBucket: "nypspassport.firebasestorage.app",
          messagingSenderId: "962134991864",
          appId: "1:962134991864:web:107576b36482fec9442c0d"
        };

        const FIREBASE_NOT_CONFIGURED = firebaseConfig.apiKey === "YOUR_API_KEY";

        let auth, db, secondaryAuth;
        if (!FIREBASE_NOT_CONFIGURED) {
          firebase.initializeApp(firebaseConfig);
          // 額外開一個「副本 App」，專門用來讓老師新增學生帳號時
          // 暫時登入新學生、拿到帳號後立刻登出，這樣才不會把老師自己的登入狀態擠掉。
          const secondaryApp = firebase.initializeApp(firebaseConfig, "secondary");
          auth = firebase.auth();
          secondaryAuth = secondaryApp.auth();
          db = firebase.firestore();
          // 登入狀態記住在這台裝置上，學生/老師不用每次都重新輸入密碼，
          // 直到自己按登出為止 (Firebase 網頁版預設就是這個行為，這裡明講一次比較保險)。
          auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        }

        // --- 通用小工具 ---

        // 把「年級」+「主題」轉成可以放進 Firestore 文件裡的安全 key
        const topicKey = (grade, topic) =>
          `${grade}__${topic}`.replace(/[\/\.\#\$\[\]]/g, '_');

        // 把「年級」+「主題」+「單字/句子」轉成可以放進 mistakes 欄位的安全 key
        const mistakeKey = (grade, topic, en) =>
          `${topicKey(grade, topic)}__${en}`.replace(/[\/\.\#\$\[\]]/g, '_');

        // 算出一個 Firestore Timestamp 距離現在幾天，讀不到就回傳 null
        // (Firestore Timestamp 有 .toDate()；剛寫入還沒同步回來時可能是
        // pending 狀態的物件，沒有 toDate，這種情況一律當作「還不知道」)
        const daysSince = (timestamp) => {
          if (!timestamp) return null;
          const d = typeof timestamp.toDate === 'function'
            ? timestamp.toDate()
            : (timestamp.seconds ? new Date(timestamp.seconds * 1000) : null);
          if (!d || isNaN(d.getTime())) return null;
          return (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
        };

        // 找出一個學生「最近一次有任何關卡活動」的時間 (掃過 progress 裡每個
        // 任務的 updatedAt，取最新的一筆)，讀不到任何紀錄就回傳 null。
        // 給老師後台的「待關心名單」用，判斷這個學生是不是已經好一陣子沒練習了。
        const studentLastActivityDate = (progress) => {
          let latest = null;
          Object.values(progress || {}).forEach(p => {
            if (!p || !p.updatedAt) return;
            const d = typeof p.updatedAt.toDate === 'function'
              ? p.updatedAt.toDate()
              : (p.updatedAt.seconds ? new Date(p.updatedAt.seconds * 1000) : null);
            if (d && !isNaN(d.getTime()) && (!latest || d > latest)) latest = d;
          });
          return latest;
        };

        // 把「班級」+「座號」轉成 Firebase Auth 用的虛擬 email
        // (學生不需要真的擁有 email，只是借用 Firebase Auth 的帳密機制。
        //  班級名稱可能包含中文，所以先做 URL 編碼確保只剩英數字元，
        //  這樣產生出來的 email 格式一定合法。)
        // version 參數是給「老師重置密碼」用的：換一個新版本號就能產生一個
        // 全新的信箱，等於幫學生「換一個新帳號」但資料都會被搬過去，
        // 因為 Firebase 沒辦法直接修改別人的密碼，只能用這個方式做到「重置」。
        const classSeatToEmail = (className, seat, version) => {
          const raw = `${className}-${seat}${version ? '-v' + version : ''}`.trim().toLowerCase().replace(/\s+/g, '');
          const safe = encodeURIComponent(raw).replace(/%/g, '_').replace(/[^a-z0-9_.\-]/gi, '_').toLowerCase();
          return `${safe}@nypspassport.local`;
        };

        // 「班級+座號」目前對應到哪個帳號 (email) 的查詢 key，用來讓密碼
        // 重置後，學生下次登入時系統知道要用新的帳號嘗試登入。
        const classSeatKey = (className, seat) =>
          `${className}__${seat}`.replace(/[\/\.\#\$\[\]]/g, '_').toLowerCase();

        // 學校目前的班級 (以年級為單位)，登入畫面下拉選單的預設值，一定會出現
        // (不管 Firestore 的 /config/classes 有沒有資料都會顯示，見下面 mergeClasses)。
        // 「測試」是專門給老師自己測試登入流程用的班級，只有 1 個座號。
        const DEFAULT_CLASSES = ['三年級', '四年級', '五年級', '六年級', '測試'];
        // 每班座號有幾號，登入畫面座號下拉選單的選項數量就是照這個範圍產生的。
        const CLASS_SEAT_COUNTS = { '三年級': 5, '四年級': 2, '五年級': 5, '六年級': 6, '測試': 1 };
        // 把「預設班級」跟「Firestore 上老師後來新增的班級」合併、去重，這樣
        // 「測試」這個班級不會因為老師之後用後台新增了別的班級就消失不見。
        const mergeClasses = (list) => Array.from(new Set([...DEFAULT_CLASSES, ...(list || [])]));

        // 老師只有固定三位、共用同一組密碼，不用個別註冊帳號。
        // 第一次用某個名字登入時，系統會自動用這組密碼建立該老師的帳號；
        // 之後同一個名字要用同一組密碼才能登入。
        const TEACHER_NAMES = ['一蓁', '逸蓁', '士頡'];
        const TEACHER_SHARED_PASSWORD = '1646276077';
        const teacherNameToEmail = (name) => {
          const raw = `teacher-${name}`.trim().toLowerCase();
          const safe = encodeURIComponent(raw).replace(/%/g, '_').replace(/[^a-z0-9_.\-]/gi, '_').toLowerCase();
          return `${safe}@nypspassport.local`;
        };

        // 口說 → 配對 → 聽得懂 → 看得懂 → 排得出來 → 拼得出來，一定要照順序解鎖。
        const STAGE_ORDER = ['speak', 'match', 'listen', 'look', 'arrange', 'spell'];
        const STAGE_LABEL = { speak: '口說練習', match: '配對遊戲', listen: '聽得懂', look: '看得懂', arrange: '排得出來', spell: '拼得出來' };
        const STAGE_ICON = { speak: '🗣️', match: '🧠', listen: '🎧', look: '👀', arrange: '🧩', spell: '⌨️' };

        // 徽章目錄。因為學生不是每天登入 (只有上英語課才會用系統)，所以徽章
        // 刻意不設計成「連續登入天數」這種每天型的機制，而是看「累積練習成果」。
        // 大部分徽章都是從既有的 progress 資料即時算出來的 (isEarned)，不用
        // 額外寫入 Firestore；只有 event: true 的徽章 (目前只有挑戰模式)
        // 是「發生過一次就算」的事件型成就，需要另外寫進 badges 欄位保存起來。
        const BADGE_DEFS = [
          { id: 'stamp_master', emoji: '🏅', title: '蓋章達人', desc: '累積蓋章完成 5 個任務',
            isEarned: (ctx) => ctx.stampedCount >= 5 },
          { id: 'speak_warrior', emoji: '🗣️', title: '口說小勇士', desc: '通過 5 個單元的口說關卡',
            isEarned: (ctx) => ctx.stageCounts.speak >= 5 },
          { id: 'match_master', emoji: '🧠', title: '配對高手', desc: '通過 5 個單元的配對關卡',
            isEarned: (ctx) => ctx.stageCounts.match >= 5 },
          { id: 'spell_king', emoji: '⌨️', title: '拼字王', desc: '通過 5 個單元的拼字關卡',
            isEarned: (ctx) => ctx.stageCounts.spell >= 5 },
          { id: 'cross_grade', emoji: '🌟', title: '跨年級達成', desc: '每個年級都至少蓋章完成一個任務',
            isEarned: (ctx) => ctx.grades.length > 0 && ctx.grades.every(g => ctx.stampedGradeSet.has(g)) },
          { id: 'challenge_champion', emoji: '🏆', title: '挑戰達人', desc: '完成一次綜合挑戰模式 (10 題)', event: true },
        ];
        // 點數只由老師「蓋章」核發，不再由系統自動給，避免被竄改，
        // 也讓「蓋章」這個動作本身變成老師肯定學生的儀式感。
        const TASK_STAMP_POINTS = 5;
        // 超過幾天沒有任何關卡活動，就算「好久沒複習/需要關心」
        const STALE_DAYS = 14;

        const isStageUnlocked = (topicProgress, stage) => {
          const idx = STAGE_ORDER.indexOf(stage);
          if (idx === 0) return true;
          const prevStage = STAGE_ORDER[idx - 1];
          return !!(topicProgress && topicProgress[prevStage]);
        };

        // 一個任務(單元)的六關是否都過了
        const isTaskComplete = (topicProgress) =>
          !!topicProgress && STAGE_ORDER.every(st => topicProgress[st]);

        // 抽出跟目標項目不同中文意思的干擾選項。優先從「同一個單元」抽，
        // 因為同單元的字比較容易混淆（例如都是動物、都是顏色），選起來才有鑑別度；
        // 同單元字數不夠時，才從同年級其他單元補足。
        const buildChoices = (grade, topic, correctItem, count = 4) => {
          const sameTopicPool = [];
          const otherTopicPool = [];
          Object.entries(curriculumData[grade] || {}).forEach(([t, items]) => {
            items.forEach(it => {
              if (it.zh === correctItem.zh) return;
              if (t === topic) sameTopicPool.push(it.zh);
              else otherTopicPool.push(it.zh);
            });
          });
          const uniqueSame = [...new Set(sameTopicPool)].sort(() => Math.random() - 0.5);
          const uniqueOther = [...new Set(otherTopicPool)].sort(() => Math.random() - 0.5);
          const distractors = [...uniqueSame, ...uniqueOther].slice(0, count - 1);
          const choices = [...distractors, correctItem.zh].sort(() => Math.random() - 0.5);
          return choices;
        };

        // --- 圖示組件 ---

        };

        // --- 資料庫內容 ---
        const BUILTIN_CURRICULUM = {
          "Grade 3": {
            "Name (名字)": [
              { en: "I", zh: "我" },
              { en: "you", zh: "你" },

        const mergeCurriculum = (builtin, customWordsByGrade) => {
          if (!customWordsByGrade || Object.keys(customWordsByGrade).length === 0) return builtin;
          const merged = {};
          Object.keys(builtin).forEach(grade => {
            merged[grade] = {};
            Object.keys(builtin[grade]).forEach(topic => {
              merged[grade][topic] = [...builtin[grade][topic]];
            });
          });
          Object.entries(customWordsByGrade).forEach(([grade, topics]) => {
            if (!merged[grade]) merged[grade] = {};
            Object.entries(topics || {}).forEach(([topic, items]) => {
              const existing = merged[grade][topic] || [];
              const existingEn = new Set(existing.map(it => it.en));
              const newItems = (items || []).filter(it => it && it.en && !existingEn.has(it.en));
              merged[grade][topic] = [...existing, ...newItems];
            });
          });
          return merged;
        };

        const SpeechEvaluator = ({ targetText, onSuccess }) => {
          const [isListening, setIsListening] = useState(false);
          const [result, setResult] = useState('idle');
          const [transcript, setTranscript] = useState('');
          const timeoutRef = useRef(null);
          const recognitionRef = useRef(null);

          const onSuccessRef = useRef(onSuccess);
          useEffect(() => {
              onSuccessRef.current = onSuccess;
          }, [onSuccess]);

          const getLevenshteinDistance = (a, b) => {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
          };

          const numberMap = {
            "0": "zero", "1": "one", "2": "two", "3": "three", "4": "four", "5": "five",
            "6": "six", "7": "seven", "8": "eight", "9": "nine", "10": "ten",
            "11": "eleven", "12": "twelve", "13": "thirteen", "14": "fourteen", "15": "fifteen",
            "16": "sixteen", "17": "seventeen", "18": "eighteen", "19": "nineteen", "20": "twenty",
            "30": "thirty", "40": "forty", "50": "fifty", "60": "sixty", "70": "seventy", "80": "eighty", "90": "ninety",
            "100": "hundred"
          };

          const normalizeText = (text) => {
             let str = text.toLowerCase().replace(/[.,?!]/g, '').trim();
             str = str.split(' ').map(word => numberMap[word] || word).join(' ');
             str = str.replace("it's", "it is").replace("i'm", "i am").replace("what's", "what is");
             return str;
          }

          useEffect(() => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
              recognitionRef.current = new SpeechRecognition();
              recognitionRef.current.continuous = false;
              recognitionRef.current.lang = 'en-US';
              recognitionRef.current.interimResults = false;

              recognitionRef.current.onresult = (event) => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                const spokenText = event.results[0][0].transcript;
                setTranscript(spokenText);
                evaluate(spokenText, targetText);
                setIsListening(false);
              };

              recognitionRef.current.onerror = (event) => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                console.error("Speech error", event.error);
                setResult('error');
                setIsListening(false);
              };

              recognitionRef.current.onend = () => {
                setIsListening(false);
              };
            }
            return () => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
            }
          }, [targetText]);

          const startListening = (e) => {
            if (e) e.stopPropagation();
            if (!recognitionRef.current) {
                alert("您的瀏覽器不支援語音辨識功能 (請使用 Chrome 或 Edge)");
                return;
            }
            setResult('listening');
            setTranscript('...');
            setIsListening(true);
            recognitionRef.current.start();

            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
                if (recognitionRef.current) recognitionRef.current.stop();
                setResult('error');
                setIsListening(false);
            }, 5000);
          };

          const stopListening = (e) => {
            if (e) e.stopPropagation();
            if (recognitionRef.current) {
              recognitionRef.current.stop();
            }
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
          };

          const evaluate = (spoken, target) => {
            const s = normalizeText(spoken);
            const t = normalizeText(target);

            if (s === t || t.includes(s) || s.includes(t)) {
              setResult('success');
              if (onSuccessRef.current) onSuccessRef.current(); 
              return;
            }

            const distance = getLevenshteinDistance(s, t);
            const maxLength = Math.max(s.length, t.length);
            const similarity = 1 - (distance / maxLength);

            if (similarity > 0.8) {
                setResult('success');
                if (onSuccessRef.current) onSuccessRef.current(); 
            } else {
                setResult('fail');
            }
          };

          useEffect(() => {
              setResult('idle');
              setTranscript('');
          }, [targetText]);

          return (
            <div className="mt-3 border-t pt-2">
              <div className="flex items-center justify-between mb-2">
                <div className="flex-1">
                    {result === 'listening' && <span className="text-sky-500 text-sm animate-pulse">正在聆聽...</span>}
                    {result === 'success' && <span className="text-green-600 font-bold flex items-center gap-1"><Icons.Star size={14} fill="currentColor"/> Perfect!</span>}
                    {result === 'good' && <span className="text-orange-500 font-bold">Good! ({transcript})</span>}
                    {result === 'error' && <span className="text-red-400 text-xs">沒聽到聲音，請再試一次</span>}
                    {result === 'idle' && <span className="text-gray-400 text-xs">點擊麥克風練習發音</span>}
                </div>
                
                <button 
                    onClick={isListening ? stopListening : startListening}
                    className={`p-3 rounded-full transition-all shadow-sm ${
                    isListening 
                        ? 'bg-red-500 text-white animate-pulse' 
                        : result === 'success' 
                            ? 'bg-green-100 text-green-600 hover:bg-green-200'
                            : 'bg-gray-100 text-gray-500 hover:bg-sky-100 hover:text-sky-500'
                    }`}
                >
                    {isListening ? <Icons.MicOff size={20} /> : <Icons.Mic size={20} />}
                </button>
              </div>

              {result === 'fail' && (
                  <CorrectionDisplay target={targetText} spoken={transcript} />
              )}
            </div>
          );
        };

        const LearningApp = ({ studentId, studentName, englishName, className, seatNumber, progress, totalPoints, mistakes, badges, onStagePass, onMistake, onClearMistake, onBadgeEarn, onTopicStart, onExit }) => {

                .replace(/They're/g, "They are").replace(/Where's/g, "Where is").replace(/don't/g, "do not")
                .replace(/doesn't/g, "does not").replace(/can't/g, "cannot").replace(/isn't/g, "is not");

              if (text === 'I') textToSpeak = "Eye"; 
              textToSpeak = textToSpeak.replace(/[.,?!]/g, ", ");

              const utterance = new SpeechSynthesisUtterance(textToSpeak);
              utterance.lang = 'en-US'; 
              utterance.rate = 0.85;
              utterance.pitch = 1.0; 
              utterance.volume = 1.0; 
              
              setSpeakingItem(text);

              utterance.onend = () => {

                  console.warn("語音播放中斷或失敗:", e);

              };

              setTimeout(() => {
                  window.speechSynthesis.speak(utterance);
                  
                  if (window.speechSynthesis.paused) {
                      window.speechSynthesis.resume();
                  }

            } else {

          const initArrange = (grade, topic) => {
            const items = [...curriculumData[grade][topic]];
            const shuffled = items.sort(() => Math.random() - 0.5);
            setStageMode('arrange');
            setSpellingQueue(shuffled);
            setSpellingIndex(0);
            setUserSpelling('');
            setSpellingFeedback('idle');
            setSpellingStats({ correct: 0, total: 0 });
            setStageReported(false);
            setMode('arrange');
            onTopicStart && onTopicStart(grade, topic);
          };

          const initSpell = (grade, topic) => {
            // 「拼得出來」只考單字，不考句子——句子只要看得懂、排得出順序、
            // 知道怎麼用就好，不需要整句一字不漏打出來 (含標點符號)。
            const allItems = curriculumData[grade][topic];
            const wordsOnly = allItems.filter(item => !item.en.includes(' '));
            const items = [...(wordsOnly.length > 0 ? wordsOnly : allItems)];
            // Name 單元特別加一題：拼出自己的英文名字 (取代原本「Please spell
            // your name.」這句固定句子——這件事本來就該是每個學生拼自己的名字，
            // 不是全班背同一句話)。學生要有在登入時填過英文名字才會出現這一題。
            if (grade === 'Grade 3' && topic === 'Name (名字)' && englishName && englishName.trim()) {
              items.push({ en: englishName.trim(), zh: '拼出你自己的英文名字 🎉' });
            }
            const shuffled = items.sort(() => Math.random() - 0.5);
            setStageMode('spell');
            setSpellingQueue(shuffled);
            setSpellingIndex(0);
            setUserSpelling('');
            setSpellingFeedback('idle');
            setSpellingStats({ correct: 0, total: 0 });
            setStageReported(false);
            setMode('spell');
            onTopicStart && onTopicStart(grade, topic);
          };

          // 聽力測驗 (只播放發音，隱藏英文，用選擇題考中文意思)
          // 閱讀理解測驗 (只顯示英文，用選擇題考中文意思)
          const initQuiz = (stageName, grade, topic) => {
            const items = [...curriculumData[grade][topic]].sort(() => Math.random() - 0.5);
            setQuizStageName(stageName);
            setQuizQueue(items);
            setQuizIndex(0);
            setQuizChoices(buildChoices(grade, topic, items[0]));
            setQuizSelected(null);
            setQuizFeedback('idle');
            setQuizScore(0);
            setStageReported(false);
            setMode(stageName === 'listen' ? 'listen_quiz' : 'read_quiz');
            if (stageName === 'listen') {
              setTimeout(() => speak(items[0].en), 300);
            }
            onTopicStart && onTopicStart(grade, topic);
          };

          // 點選項只是先選起來 (可以反悔、換選別的)，要按「確認送出答案」才會真的送出、
          // 鎖住答案並顯示對錯。避免小朋友手滑點錯就直接被判定答錯。
          const selectQuizChoice = (choice) => {
            if (quizFeedback !== 'idle') return;
            setQuizSelected(choice);
          };

          const submitQuizAnswer = () => {
            if (quizFeedback !== 'idle' || quizSelected === null) return;
            const currentItem = quizQueue[quizIndex];
            const correct = quizSelected === currentItem.zh;
            setQuizFeedback(correct ? 'correct' : 'wrong');
            if (correct) {
              setQuizScore(prev => prev + 1);
              // 加強複習模式：答對了就把這一題從錯題本移除
              if (mode === 'mistake_review' && onClearMistake && currentItem.mistakeKey) {
                onClearMistake(currentItem.mistakeKey);
              }
            } else if (mode !== 'mistake_review' && onMistake) {
              // 一般聽力/閱讀測驗答錯：記錄到錯題本，讓學生之後可以加強複習
              onMistake(currentGrade, currentTopic, currentItem, quizStageName);
            }
          };

          const nextQuizQuestion = () => {
            const nextIndex = quizIndex + 1;
            if (nextIndex >= quizQueue.length) {
              setQuizIndex(nextIndex); // 觸發顯示總結畫面
              return;
            }
            setQuizIndex(nextIndex);
            const nextItem = quizQueue[nextIndex];
            const nextGrade = mode === 'mistake_review' ? nextItem.grade : currentGrade;
            const nextTopic = mode === 'mistake_review' ? nextItem.topic : currentTopic;
            setQuizChoices(buildChoices(nextGrade, nextTopic, nextItem));
            setQuizSelected(null);
            setQuizFeedback('idle');
            if (quizStageName === 'listen') {
              setTimeout(() => speak(nextItem.en), 300);
            }
          };

          // 加強複習 (錯題本)：把 mistakes 欄位裡的題目集合起來，用同一套
          // 聽力/閱讀選擇題畫面重新出題，橫跨不同單元也沒關係，因為每一題
          // 都自己記著自己的 grade/topic/mistakeKey。
          const initMistakeReview = () => {
            const items = Object.entries(mistakes || {}).map(([key, m]) => ({
              en: m.en, zh: m.zh, grade: m.grade, topic: m.topic, mistakeKey: key,
            })).sort(() => Math.random() - 0.5);
            if (items.length === 0) return;
            setQuizStageName('review');
            setQuizQueue(items);
            setQuizIndex(0);
            setQuizChoices(buildChoices(items[0].grade, items[0].topic, items[0]));
            setQuizSelected(null);
            setQuizFeedback('idle');
            setQuizScore(0);
            setStageReported(false);
            setMode('mistake_review');
          };

          const initChallenge = (grade) => {
            setChallengeGrade(grade);
            let items = [];
            
            if (grade === 'ALL') {
                Object.values(curriculumData).forEach(g => {
                    Object.values(g).forEach(t => items.push(...t));
                });
            } else {
                Object.values(curriculumData[grade]).forEach(t => items.push(...t));
            }
            
            let shuffled = [...items].sort(() => Math.random() - 0.5);
            
            let words = shuffled.filter(item => !item.en.includes(' '));
            let sentences = shuffled.filter(item => item.en.includes(' '));
            
            let spellItems = [];
            let speakItems = [];

            if (words.length > 0) spellItems.push(words.pop());
            if (sentences.length > 0) spellItems.push(sentences.pop());

            let remaining = [...words, ...sentences].sort(() => Math.random() - 0.5);

            while (spellItems.length < 6 && remaining.length > 0) {
                spellItems.push(remaining.pop());
            }

            while (speakItems.length < 4 && remaining.length > 0) {
                speakItems.push(remaining.pop());
            }

            spellItems = spellItems.map(item => ({ ...item, type: 'spell' }));
            speakItems = speakItems.map(item => ({ ...item, type: 'speak' }));
            
            const questions = [...spellItems, ...speakItems].sort(() => Math.random() - 0.5);
            
            setChallengeQuestions(questions);
            setChallengeIndex(0);
            setChallengeScore(0);
            setChFeedback('idle');
            setChallengeBadgeReported(false);
            setMode('challenge_play');
          };

          useEffect(() => {
            if ((mode === 'arrange' || mode === 'spell') && spellingQueue.length > 0 && spellingIndex < spellingQueue.length) {
                const currentText = spellingQueue[spellingIndex].en;
                if (mode === 'arrange') {
                    // 片語/句子 -> 打散單字重組；單一單字 -> 打散字母重組
                    const parts = currentText.includes(' ') ? currentText.split(' ') : currentText.split('');
                    setScrambleParts({ available: [...parts].sort(() => Math.random() - 0.5), placed: [] });
                }
                setUserSpelling('');
                setSpellingFeedback('idle');
            }
          }, [spellingIndex, spellingQueue, mode]);

          // 當「排」或「拼」關卡全部完成時，回報進度並給點數
          useEffect(() => {
            if ((mode === 'arrange' || mode === 'spell') && spellingQueue.length > 0 &&
                spellingIndex >= spellingQueue.length && !stageReported) {
              setStageReported(true);
              onStagePass && onStagePass(currentGrade, currentTopic, mode, spellingQueue.length);
            }
          }, [mode, spellingIndex, spellingQueue, stageReported]);

          // 當聽力/閱讀測驗答完全部題目、且答對率達 80% 以上時，回報進度並給點數
          useEffect(() => {
            if ((mode === 'listen_quiz' || mode === 'read_quiz') && quizQueue.length > 0 &&
                quizIndex >= quizQueue.length && !stageReported) {
              const passed = quizScore >= Math.ceil(quizQueue.length * 0.8);
              if (passed) {
                setStageReported(true);
                onStagePass && onStagePass(currentGrade, currentTopic, quizStageName, quizQueue.length);
              }
            }
          }, [mode, quizIndex, quizQueue, quizScore, stageReported]);

          // 配對遊戲全部配完時，回報進度 (配對現在也是主線關卡之一)
          useEffect(() => {
            if (mode === 'game' && gameCards.length > 0 &&
                matchedPairs.length * 2 === gameCards.length && !stageReported) {
              setStageReported(true);
              onStagePass && onStagePass(currentGrade, currentTopic, 'match', gameCards.length / 2);
            }
          }, [mode, matchedPairs, gameCards, stageReported]);

          // 綜合挑戰模式跑完 10 題 (不論分數高低) 就發一個「挑戰達人」徽章，
          // 這也是事件型成就，跟挑戰模式本身的分數/題目沒有對應到任何
          // progress 任務，所以一樣要另外寫進 badges 欄位保存。
          useEffect(() => {
            if (mode === 'challenge_play' && challengeQuestions.length > 0 &&
                challengeIndex >= 10 && !challengeBadgeReported) {
              setChallengeBadgeReported(true);
              onBadgeEarn && onBadgeEarn('challenge_champion');
            }
          }, [mode, challengeIndex, challengeQuestions, challengeBadgeReported]);

          // 口說練習全部題目都用麥克風唸對時，回報進度；只要有題目一直偵測不到、
          // 學生按了「跳過」，這關就不會自動過，要等老師在後台聽學生唸過、手動過關。
          useEffect(() => {
            if (mode === 'speak_quiz' && speakQueue.length > 0 &&
                speakIndex >= speakQueue.length && !stageReported) {
              const passedCount = speakResults.filter(r => r === 'pass').length;
              if (passedCount === speakQueue.length) {
                setStageReported(true);
                onStagePass && onStagePass(currentGrade, currentTopic, 'speak', speakQueue.length);
              }
            }
          }, [mode, speakIndex, speakQueue, speakResults, stageReported]);

          useEffect(() => {
              if (mode === 'challenge_play' && challengeQuestions.length > 0 && challengeIndex < 10) {
                  const q = challengeQuestions[challengeIndex];
                  setChFeedback('idle');
                  setChUserSpelling('');
                  if (q.type === 'spell' && q.en.includes(' ')) {
                      const parts = q.en.split(' ');
                      setChScrambleParts({ available: [...parts].sort(() => Math.random() - 0.5), placed: [] });
                  }
              }
          }, [challengeIndex, challengeQuestions, mode]);

          const nextChallengeQuestion = (isCorrect) => {
              if (isCorrect) {
                  setChallengeScore(prev => prev + 1);
              }
              setChallengeIndex(prev => prev + 1);
          };

          const checkChallengeSpelling = () => {
              const currentItem = challengeQuestions[challengeIndex];
              const cleanUser = spellableForm(chUserSpelling).toLowerCase();
              const cleanTarget = spellableForm(currentItem.en).toLowerCase();

              if (cleanUser === cleanTarget) {
                  setChFeedback('correct');
                  speak("Correct! " + (currentItem.en === 'I' ? 'Eye' : currentItem.en));
                  setTimeout(() => nextChallengeQuestion(true), 1500);
              } else {
                  setChFeedback('wrong');
                  speak("Try again.");
              }
          };

          const handleChallengeScrambleSelect = (word, index) => {
            if (chFeedback === 'correct') return;
            const newAvailable = [...chScrambleParts.available];
            newAvailable.splice(index, 1);
            const newPlaced = [...chScrambleParts.placed, word];
            setChScrambleParts({ available: newAvailable, placed: newPlaced });

            const currentTarget = challengeQuestions[challengeIndex].en;
            if (newPlaced.length === currentTarget.split(' ').length) {
                if (newPlaced.join(' ') === currentTarget) {
                    setChFeedback('correct');
                    speak("Correct!");
                    setTimeout(() => nextChallengeQuestion(true), 1500);
                } else {
                    setChFeedback('wrong');
                    speak("Try again.");
                }
            }
          };
          const handleChallengeScrambleDeselect = (word, index) => {
            if (chFeedback === 'correct') return;
            const newPlaced = [...chScrambleParts.placed];
            newPlaced.splice(index, 1);
            const newAvailable = [...chScrambleParts.available, word];
            setChScrambleParts({ available: newAvailable, placed: newPlaced });
            setChFeedback('idle');
          };

          const checkWordSpelling = () => {
            const currentItem = spellingQueue[spellingIndex];
            const cleanUser = spellableForm(userSpelling).toLowerCase();
            const cleanTarget = spellableForm(currentItem.en).toLowerCase();

            if (cleanUser === cleanTarget) {
              setSpellingFeedback('correct');
              speak("Correct! " + (currentItem.en === 'I' ? 'Eye' : currentItem.en));
              setSpellingStats(prev => ({ ...prev, correct: prev.correct + 1 }));
            } else {
              setSpellingFeedback('wrong');
              speak("Try again.");
            }
          };
          const handleScrambleSelect = (word, index) => {
            if (spellingFeedback === 'correct') return;
            const newAvailable = [...scrambleParts.available];
            newAvailable.splice(index, 1);
            const newPlaced = [...scrambleParts.placed, word];
            setScrambleParts({ available: newAvailable, placed: newPlaced });

            const currentTarget = spellingQueue[spellingIndex].en;
            const isSentence = currentTarget.includes(' ');
            const sep = isSentence ? ' ' : '';
            const targetParts = isSentence ? currentTarget.split(' ') : currentTarget.split('');
            if (newPlaced.length === targetParts.length) {
                if (newPlaced.join(sep) === currentTarget) {
                    setSpellingFeedback('correct');
                    speak("Correct! " + (currentTarget === 'I' ? 'Eye' : currentTarget));
                    setSpellingStats(prev => ({ ...prev, correct: prev.correct + 1 }));
                } else {
                    setSpellingFeedback('wrong');
                    speak("Try again.");
                }
            }
          };
          const handleScrambleDeselect = (word, index) => {
            if (spellingFeedback === 'correct') return;
            const newPlaced = [...scrambleParts.placed];
            newPlaced.splice(index, 1);
            const newAvailable = [...scrambleParts.available, word];
            setScrambleParts({ available: newAvailable, placed: newPlaced });
            setSpellingFeedback('idle');
          };
          const nextQuestion = () => setSpellingIndex(prev => prev + 1);

          const handleCardClick = (index) => {
            if (isWrong) return;
            if (selectedCards.includes(index)) return;
            if (matchedPairs.includes(gameCards[index].pairId.toString())) return;

            const newSelected = [...selectedCards, index];
            setSelectedCards(newSelected);

            if (newSelected.length === 2) {
              const firstCard = gameCards[newSelected[0]];
              const secondCard = gameCards[newSelected[1]];

              if (firstCard.pairId === secondCard.pairId) {
                setMatchedPairs([...matchedPairs, firstCard.pairId.toString()]);
                setSelectedCards([]);
                if (firstCard.type === 'en') speak(firstCard.content);
                else speak(secondCard.content);
              } else {
                setIsWrong(true);
                setTimeout(() => {
                  setSelectedCards([]);
                  setIsWrong(false);
                }, 1000);
              }
            }
          };

          // 1. 主畫面
          if (mode === 'menu') {
            // 每個年級蓋章/進行中的任務數，讓學生一進畫面就看得到進度，
            // 不用特地跑去「我的學習護照」查看。
            const gradeProgress = {};
            Object.keys(curriculumData).forEach(grade => {
              const topics = Object.keys(curriculumData[grade]);
              let stamped = 0, started = 0;
              topics.forEach(t => {
                const p = progress[topicKey(grade, t)];
                if (p) { started++; if (p.stamped) stamped++; }
              });
              gradeProgress[grade] = { stamped, started, total: topics.length };
            });
            return (
              <div className="min-h-screen bg-sky-50 font-sans pb-20">
                <Header
                  title="鳥嶼國小英語護照"
                  subtitle={`${studentName || ''}　${className || ''}${seatNumber ? ' ' + seatNumber + '號' : ''}`}
                  right={
                    <div className="flex items-center gap-3">
                      <div className="flex items-center gap-1 bg-white/20 px-3 py-1.5 rounded-full font-bold">
                        <Icons.Star size={18} fill="currentColor" />
                        <span>{totalPoints ?? 0} 點</span>
                      </div>
                      {onExit && (
                        <button onClick={onExit} className="p-2 hover:bg-sky-600 rounded-full transition-colors" title="登出">
                          <Icons.X size={20} />
                        </button>
                      )}
                    </div>
                  }
                />

                <div className="p-6 max-w-4xl mx-auto">
                    <button
                      onClick={() => setMode('my_passport')}
                      className="w-full mb-8 bg-gradient-to-r from-sky-500 to-indigo-500 p-5 rounded-2xl shadow-lg border-b-4 border-indigo-700 hover:translate-y-[-2px] transition-all flex items-center gap-4 text-white"
                    >
                      <span className="text-4xl">🛂</span>
                      <div className="text-left flex-1">
                        <div className="font-bold text-xl">我的學習護照</div>
                        <div className="text-sky-100 text-sm">查看我完成了哪些任務、蓋了幾個章、累積了多少點</div>
                      </div>
                      <Icons.ArrowLeft className="rotate-180" size={24} />
                    </button>

                    <h2 className="text-xl font-bold text-sky-800 mb-4 flex items-center gap-2"><Icons.BookOpen /> 課程學習 (Learn & Play)</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    {Object.keys(curriculumData).map((grade) => {
                        const gp = gradeProgress[grade];
                        return (
                        <button
                        key={grade}
                        onClick={() => { setCurrentGrade(grade); setMode('learn_topics'); }}
                        className="bg-white p-6 rounded-2xl shadow-lg border-b-8 border-sky-200 hover:border-sky-300 hover:translate-y-[-2px] transition-all flex flex-col items-center gap-3 group"
                        >
                        <div className="w-16 h-16 bg-sky-100 rounded-full flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">
                            {grade.includes('3') ? '🥉' : grade.includes('4') ? '🍀' : grade.includes('5') ? '🖐️' : '🎓'}
                        </div>
                        <span className="text-2xl font-bold text-gray-700">{grade}</span>
                        {gp && (
                          <span className="text-xs font-bold text-sky-500 bg-sky-50 px-3 py-1 rounded-full">
                            {gp.stamped > 0 ? `🏅 已蓋章 ${gp.stamped}/${gp.total}` : gp.started > 0 ? `進行中 ${gp.started}/${gp.total}` : '尚未開始'}
                          </span>
                        )}
                        </button>
                        );
                    })}
                    </div>

                    <h2 className="text-xl font-bold text-orange-800 mb-4 flex items-center gap-2"><Icons.Zap /> 綜合挑戰 (Challenge)</h2>
                    <button
                        onClick={() => setMode('challenge_select')}
                        className="w-full bg-gradient-to-r from-orange-400 to-red-500 p-8 rounded-3xl shadow-xl border-b-8 border-orange-700 hover:translate-y-[-2px] transition-all flex flex-col items-center justify-center text-white group"
                    >
                        <Icons.Trophy size={48} className="mb-2 group-hover:scale-110 transition-transform animate-pulse-fast"/>
                        <span className="text-3xl font-bold tracking-widest">進入挑戰模式</span>
                        <span className="text-orange-100 mt-2">隨機 10 題測驗，考驗你的實力！</span>
                    </button>
                </div>
              </div>
            );
          }

          // 1b. 我的學習護照：完成了哪些任務、蓋了幾個章
          if (mode === 'my_passport') {
            const allTopicKeys = [];
            Object.keys(curriculumData).forEach(grade => {
              Object.keys(curriculumData[grade]).forEach(topic => allTopicKeys.push([grade, topic]));
            });
            const startedCount = allTopicKeys.filter(([g, t]) => progress[topicKey(g, t)]).length;
            const stampedCount = allTopicKeys.filter(([g, t]) => (progress[topicKey(g, t)] || {}).stamped).length;

            // 複習提醒：已經蓋章完成、但超過 STALE_DAYS 天沒有任何關卡活動的任務，
            // 特別列出來提醒學生回去複習一下 (progress[tk].updatedAt 每次
            // 過關都會更新，所以可以拿來當作「上次練習這個任務的時間」)。
            const staleTasks = allTopicKeys.filter(([g, t]) => {
              const p = progress[topicKey(g, t)];
              if (!p || !p.stamped) return false;
              const days = daysSince(p.updatedAt);
              return days !== null && days >= STALE_DAYS;
            });

            // 徽章：算出各關卡分別通過了幾個單元、蓋章的年級有哪些，
            // 拿去跟 BADGE_DEFS 的條件比對，決定哪些徽章已經解鎖。
            const stageCounts = { speak: 0, match: 0, listen: 0, look: 0, arrange: 0, spell: 0 };
            const stampedGradeSet = new Set();
            allTopicKeys.forEach(([g, t]) => {
              const p = progress[topicKey(g, t)];
              if (!p) return;
              STAGE_ORDER.forEach(st => { if (p[st]) stageCounts[st]++; });
              if (p.stamped) stampedGradeSet.add(g);
            });
            const badgeCtx = {
              stampedCount, stageCounts, stampedGradeSet,
              grades: Object.keys(curriculumData),
            };
            const earnedBadgeIds = new Set(badges || []);
            const badgeStatus = BADGE_DEFS.map(b => ({
              ...b,
              earned: b.event ? earnedBadgeIds.has(b.id) : b.isEarned(badgeCtx),
            }));

            return (
              <div className="min-h-screen bg-indigo-50 font-sans pb-20">
                <Header title="我的學習護照" subtitle={`已蓋章 ${stampedCount} 個任務 · 已開始 ${startedCount} 個任務`} onBack={() => setMode('menu')} />

                <div className="p-4 max-w-4xl mx-auto">
                  <div className="bg-white rounded-2xl shadow p-5 mb-6 flex items-center justify-center gap-3">
                    <Icons.Star size={28} className="text-yellow-400" fill="currentColor" />
                    <span className="text-3xl font-bold text-gray-700">{totalPoints ?? 0}</span>
                    <span className="text-gray-400">點</span>
                  </div>

                  {mistakes && Object.keys(mistakes).length > 0 && (
                    <button
                      onClick={initMistakeReview}
                      className="w-full mb-6 bg-gradient-to-r from-pink-400 to-rose-500 p-5 rounded-2xl shadow-xl border-b-4 border-pink-700 hover:translate-y-[-2px] transition-all flex items-center gap-4 text-white"
                    >
                      <span className="text-4xl">🎯</span>
                      <div className="text-left flex-1">
                        <div className="text-xl font-bold">加強練習 (錯題本)</div>
                        <div className="text-pink-50 text-sm mt-1">還有 {Object.keys(mistakes).length} 題答錯過的題目，複習一下、答對就會從清單移除！</div>
                      </div>
                    </button>
                  )}

                  {staleTasks.length > 0 && (
                    <div className="w-full mb-6 bg-amber-50 border-2 border-amber-200 rounded-2xl p-5">
                      <h3 className="font-bold text-amber-800 mb-1 flex items-center gap-2">
                        <span className="text-2xl">📅</span> 好久沒複習囉！
                      </h3>
                      <p className="text-sm text-amber-600 mb-3">這些任務已經超過 {STALE_DAYS} 天沒有練習了，點一下回去複習吧</p>
                      <div className="flex flex-wrap gap-2">
                        {staleTasks.map(([g, t]) => (
                          <button
                            key={`${g}__${t}`}
                            onClick={() => { setCurrentGrade(g); setCurrentTopic(t); setMode('learn_items'); }}
                            className="px-4 py-2 bg-white border-2 border-amber-300 rounded-full text-amber-700 font-bold text-sm hover:bg-amber-100 transition-colors"
                          >
                            {t}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="w-full mb-8 bg-white rounded-2xl shadow p-5">
                    <h3 className="font-bold text-indigo-700 mb-1 flex items-center gap-2">
                      <span className="text-2xl">🏆</span> 我的徽章
                    </h3>
                    <p className="text-sm text-gray-400 mb-4">
                      已解鎖 {badgeStatus.filter(b => b.earned).length} / {badgeStatus.length} 個徽章
                    </p>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                      {badgeStatus.map(b => (
                        <div
                          key={b.id}
                          className={`rounded-2xl p-4 text-center border-2 ${b.earned ? 'bg-yellow-50 border-yellow-300' : 'bg-gray-50 border-gray-100 opacity-50'}`}
                        >
                          <div className="text-4xl mb-1">{b.emoji}</div>
                          <div className="font-bold text-sm text-gray-700">{b.title}</div>
                          <div className="text-xs text-gray-400 mt-1">{b.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {Object.keys(curriculumData).map(grade => (
                    <div key={grade} className="mb-6">
                      <h3 className="font-bold text-indigo-700 mb-2">{grade}</h3>
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                        {Object.keys(curriculumData[grade]).map(topic => {
                          const tk = topicKey(grade, topic);
                          const p = progress[tk];
                          const started = !!p;
                          const stamped = !!(p && p.stamped);
                          return (
                            <div
                              key={topic}
                              className={`relative rounded-2xl p-4 shadow-sm border-2 overflow-hidden ${started ? 'bg-white border-indigo-100' : 'bg-gray-50 border-gray-100 opacity-60'}`}
                            >
                              {stamped && (
                                <div className="absolute -top-2 -right-3 rotate-12 text-red-500 border-2 border-red-400 rounded-lg px-2 py-0.5 text-[10px] font-black bg-red-50/90">
                                  已認證
                                </div>
                              )}
                              <div className="flex items-center gap-2 mb-2">
                                <span className="text-2xl">{getIcon(topic)}</span>
                                <span className="font-bold text-gray-700 text-sm">{topic.split('(')[0]}</span>
                              </div>
                              <div className="flex items-center gap-1">
                                {STAGE_ORDER.map(st => (
                                  <span key={st} className={`text-sm ${p && p[st] ? 'opacity-100' : 'opacity-20 grayscale'}`}>{STAGE_ICON[st]}</span>
                                ))}
                              </div>
                              {!started && <p className="text-[11px] text-gray-300 mt-1">尚未開始</p>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          }

          // 2. 選擇學習主題
          if (mode === 'learn_topics') {
            return (
              <div className="min-h-screen bg-sky-50 font-sans">
                <Header 
                  title={currentGrade} 
                  subtitle="請選擇主題 (Topic)" 
                  onBack={() => { setCurrentGrade(null); setMode('menu'); }} 
                />
                <div className="p-6 grid grid-cols-2 md:grid-cols-3 gap-4 max-w-4xl mx-auto">
                  {Object.keys(curriculumData[currentGrade]).map((topic) => {
                    const tp = progress[topicKey(currentGrade, topic)];
                    const started = !!tp;
                    const stamped = !!(tp && tp.stamped);
                    const passedCount = tp ? STAGE_ORDER.filter(st => tp[st]).length : 0;
                    return (
                      <button
                        key={topic}
                        onClick={() => { setCurrentTopic(topic); setMode('learn_items'); }}
                        className="relative bg-white p-6 rounded-xl shadow border-b-4 border-orange-200 hover:border-orange-300 active:border-b-0 active:translate-y-1 transition-all flex flex-col items-center text-center h-full justify-center"
                      >
                        {stamped && (
                          <div className="absolute -top-2 -right-3 rotate-12 text-red-500 border-2 border-red-400 rounded-lg px-2 py-0.5 text-[10px] font-black bg-red-50/95 shadow">
                            已蓋章
                          </div>
                        )}
                        <span className="text-4xl mb-3">{getIcon(topic)}</span>
                        <span className="font-bold text-gray-700 text-lg">{topic.split('(')[0]}</span>
                        <span className="text-sm text-gray-400 mb-2">{topic.split('(')[1]?.replace(')', '')}</span>
                        {started && !stamped && (
                          <div className="w-full mt-1">
                            <div className="text-[11px] text-orange-500 font-bold mb-1">進行中 {passedCount}/{STAGE_ORDER.length}</div>
                            <div className="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                              <div className="h-full bg-orange-400" style={{ width: `${(passedCount / STAGE_ORDER.length) * 100}%` }}></div>
                            </div>
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          }

          // 3. 學習單字與句型清單
          if (mode === 'learn_items') {
            const topicProgress = (progress && progress[topicKey(currentGrade, currentTopic)]) || {};
            return (
              <div className="min-h-screen bg-green-50 font-sans pb-52">
                <Header
                  title={`${currentTopic?.split('(')[0]}`}
                  subtitle="學習模式: 點擊聽發音 / 錄音 / 拼字"
                  onBack={() => { setCurrentTopic(null); setMode('learn_topics'); }}
                />

                <div className="max-w-3xl mx-auto px-4 pt-4">
                  <div className="bg-white rounded-2xl shadow-sm border border-green-100 p-3 flex items-center justify-around">
                    {STAGE_ORDER.map((stage, i) => {
                      const passed = !!topicProgress[stage];
                      const unlocked = isStageUnlocked(topicProgress, stage);
                      return (
                        <div key={stage} className="flex items-center">
                          <div className={`flex flex-col items-center gap-1 ${passed ? 'text-green-600' : unlocked ? 'text-gray-600' : 'text-gray-300'}`}>
                            <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg border-2 ${passed ? 'bg-green-100 border-green-400' : unlocked ? 'bg-gray-50 border-gray-300' : 'bg-gray-50 border-gray-200'}`}>
                              {passed ? <Icons.Check size={20} /> : STAGE_ICON[stage]}
                            </div>
                            <span className="text-xs font-bold">{STAGE_LABEL[stage]}</span>
                          </div>
                          {i < STAGE_ORDER.length - 1 && <div className={`w-6 md:w-10 h-0.5 mx-1 ${topicProgress[stage] ? 'bg-green-300' : 'bg-gray-200'}`}></div>}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="p-4 max-w-3xl mx-auto space-y-4">
                  {curriculumData[currentGrade][currentTopic].map((item, idx) => (
                    <div 
                      key={idx}
                      onClick={() => speak(item.en)}
                      className={`
                        relative bg-white p-5 rounded-2xl shadow-sm border-2 cursor-pointer transition-all transform hover:scale-[1.01] active:scale-[0.99]
                        ${speakingItem === item.en ? 'border-green-400 ring-2 ring-green-100' : 'border-transparent hover:border-green-200'}
                      `}
                    >
                      <div className="flex items-center gap-5 mb-2">
                        <div className="w-16 h-16 bg-gradient-to-br from-green-100 to-green-50 rounded-2xl flex items-center justify-center text-4xl flex-shrink-0 shadow-inner">
                          {getIcon(item.en)}
                        </div>
                        <div className="flex-1">
                          <h3 className="text-2xl font-bold text-gray-800 mb-1 font-serif tracking-wide">
                            {item.en}
                          </h3>
                          <p className="text-gray-500 text-lg">
                            {item.zh}
                          </p>
                        </div>
                        <div className={`text-green-500 p-2 rounded-full hover:bg-green-50 ${speakingItem === item.en ? 'animate-bounce' : 'opacity-60'}`}>
                          <Icons.Volume2 size={28} />
                        </div>
                      </div>
                      <SpeechEvaluator targetText={item.en} />
                    </div>
                  ))}
                </div>
  
                <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-green-100 pt-3 pb-3 px-3 z-20">
                  <div className="max-w-3xl mx-auto grid grid-cols-3 gap-2">
                    {[
                      { stage: 'speak', label: '口說練習', color: 'rose', run: () => initSpeak(currentGrade, currentTopic) },
                      { stage: 'match', label: '配對遊戲', color: 'indigo', run: () => initGame(currentGrade, currentTopic) },
                      { stage: 'listen', label: '聽力測驗', color: 'sky', run: () => initQuiz('listen', currentGrade, currentTopic) },
                      { stage: 'look', label: '閱讀理解', color: 'emerald', run: () => initQuiz('look', currentGrade, currentTopic) },
                      { stage: 'arrange', label: '排字挑戰', color: 'amber', run: () => initArrange(currentGrade, currentTopic) },
                      { stage: 'spell', label: '拼字挑戰', color: 'violet', run: () => initSpell(currentGrade, currentTopic) },
                    ].map(({ stage, label, color, run }) => {
                      const unlocked = isStageUnlocked(topicProgress, stage);
                      const passed = !!topicProgress[stage];
                      return (
                        <button
                          key={stage}
                          disabled={!unlocked}
                          onClick={run}
                          className={`
                            relative flex flex-col items-center justify-center gap-1 py-3 rounded-xl font-bold text-xs shadow border-b-4 transition-all
                            ${!unlocked ? 'bg-gray-100 text-gray-300 border-gray-200 cursor-not-allowed' :
                              passed ? `bg-${color}-100 text-${color}-700 border-${color}-300` :
                              `bg-${color}-500 text-white border-${color}-700 hover:brightness-105 active:border-b-0 active:translate-y-1`}
                          `}
                        >
                          {!unlocked && <Icons.Info size={14} className="absolute top-1 right-1 opacity-60" />}
                          <span className="text-xl leading-none">{unlocked ? STAGE_ICON[stage] : '🔒'}</span>
                          <span>{label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          }

          // 4. 配對遊戲
          if (mode === 'game') {
            const isWin = matchedPairs.length * 2 === gameCards.length;
            return (
              <div className="min-h-screen bg-indigo-50 font-sans pb-20">
                <Header 
                  title={`${currentTopic?.split('(')[0]} - 配對`} 
                  subtitle="配對練習 (Matching Game)" 
                  onBack={() => setMode('learn_items')} 
                />
                
                <div className="p-4 max-w-4xl mx-auto">
                  {isWin ? (
                    <div className="text-center py-12 animate-bounce-in bg-white rounded-3xl shadow-xl p-8">
                      <div className="text-8xl mb-4 text-yellow-400 mx-auto w-fit"><Icons.Trophy size={80} fill="currentColor"/></div>
                      <h2 className="text-3xl font-bold text-indigo-600 mb-4">恭喜完成!</h2>
                      <div className="flex justify-center gap-4 flex-wrap">
                        <button 
                          onClick={() => initGame(currentGrade, currentTopic)}
                          className="px-6 py-3 bg-indigo-500 text-white rounded-full font-bold shadow-lg hover:bg-indigo-600 flex items-center gap-2"
                        >
                          <Icons.RefreshCw size={20}/> 再玩一次
                        </button>
                        <button 
                          onClick={() => setMode('learn_items')}
                          className="px-6 py-3 bg-gray-200 text-gray-700 rounded-full font-bold shadow hover:bg-gray-300 flex items-center gap-2"
                        >
                          <Icons.BookOpen size={20}/> 回到學習
                        </button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="flex justify-between items-center mb-4 px-2">
                        <span className="font-bold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full">Score: {matchedPairs.length} / {gameCards.length / 2}</span>
                        <span className="text-sm text-gray-500">點擊英文，再點擊中文</span>
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {gameCards.map((card, index) => {
                          const isSelected = selectedCards.includes(index);
                          const isMatched = matchedPairs.includes(card.pairId.toString());
                          const isWrongCard = isWrong && isSelected;

                          if (isMatched) return <div key={card.id} className="invisible h-24"></div>;

                          return (
                            <button
                              key={card.id}
                              onClick={() => handleCardClick(index)}
                              className={`
                                h-24 md:h-32 rounded-xl p-2 flex flex-col items-center justify-center text-center shadow-sm transition-all text-lg font-bold border-b-4 active:border-b-0 active:translate-y-1 relative overflow-hidden
                                ${isSelected ? 'bg-indigo-100 border-indigo-500' : 'bg-white border-gray-200 hover:border-indigo-300'}
                                ${isWrongCard ? 'animate-shake bg-red-100 border-red-400' : ''}
                                ${card.type === 'en' ? 'text-indigo-900' : 'text-gray-600'}
                              `}
                            >
                              <span className="z-10 relative">{card.content}</span>
                            </button>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              </div>
            );
          }

          // 4b. 口說練習 (第一關)：麥克風常誤判，全部通過才自動過關，
          // 沒通過的題目會列出來請學生去找老師唸給老師聽。
          if (mode === 'speak_quiz') {
            const showSummary = speakIndex >= speakQueue.length;

            if (showSummary) {
              const passedCount = speakResults.filter(r => r === 'pass').length;
              const localAllPassed = speakQueue.length > 0 && passedCount === speakQueue.length;
              // progress 是即時的 Firestore 資料，如果老師已經在後台按過
              // 「✅口說過關」，這裡不用學生重新整理頁面，畫面會自動變成過關。
              const teacherOverrode = !!(progress[topicKey(currentGrade, currentTopic)] && progress[topicKey(currentGrade, currentTopic)].speak);
              const allPassed = localAllPassed || teacherOverrode;
              const failedWords = speakQueue.filter((_, i) => speakResults[i] !== 'pass').map(it => it.en);
              return (
                <div className="min-h-screen bg-rose-50 font-sans pb-20">
                  <Header title="口說練習結果" onBack={() => setMode('learn_items')} />
                  <div className="p-8 max-w-md mx-auto text-center mt-10 bg-white rounded-3xl shadow-xl">
                    <div className="text-6xl mb-4">{allPassed ? '🎉' : '🙋'}</div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">
                      {teacherOverrode && !localAllPassed ? '老師已經幫你過關囉！' : allPassed ? '太棒了，全部通過！' : '還有幾個發音要練習'}
                    </h2>
                    <p className="text-xl text-gray-600 mb-2">
                      通過：<span className="font-bold text-3xl text-green-600">{passedCount}</span> / {speakQueue.length}
                    </p>
                    {!allPassed && (
                      <div className="bg-orange-50 border border-orange-200 rounded-xl p-4 my-4 text-left">
                        <p className="text-sm text-orange-700 font-bold mb-2">請把這幾個字帶去找老師，唸給老師聽，老師確認你唸對了就會幫你打勾過關：</p>
                        <p className="text-lg font-bold text-orange-800">{failedWords.join('、')}</p>
                      </div>
                    )}
                    <p className="text-sm text-gray-400 mb-6">
                      {allPassed ? '已記錄到你的學習護照，下一關解鎖囉！' : '麥克風有時候聽不清楚很正常，可以多練習幾次，或是直接找老師唸給他聽——老師確認過關後這裡會自動更新，不用重新整理頁面'}
                    </p>
                    <button
                      onClick={() => initSpeak(currentGrade, currentTopic)}
                      className="w-full py-3 bg-rose-500 text-white rounded-xl font-bold shadow mb-3 hover:bg-rose-600"
                    >
                      再試一次
                    </button>
                    <button
                      onClick={() => setMode('learn_items')}
                      className="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-bold shadow hover:bg-gray-300"
                    >
                      回到學習
                    </button>
                  </div>
                </div>
              );
            }

            const currentItem = speakQueue[speakIndex];
            const advance = (passed) => {
              setSpeakResults(prev => {
                const next = [...prev];
                next[speakIndex] = passed ? 'pass' : 'fail';
                return next;
              });
              setSpeakIndex(prev => prev + 1);
            };

            return (
              <div className="min-h-screen bg-rose-50 font-sans pb-20">
                <Header
                  title="口說練習 (口說)"
                  subtitle={`Question ${speakIndex + 1} / ${speakQueue.length}`}
                  onBack={() => setMode('learn_items')}
                />
                <div className="p-6 max-w-lg mx-auto flex flex-col items-center gap-6 mt-4">
                  <div className="bg-white p-8 rounded-3xl shadow-lg w-full flex flex-col items-center relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2 bg-rose-200">
                      <div className="h-full bg-rose-500 transition-all duration-500" style={{ width: `${(speakIndex/speakQueue.length)*100}%`}}></div>
                    </div>
                    <div className="text-6xl mb-2 mt-2 animate-bounce-slow">{getIcon(currentItem.en)}</div>
                    <h3 className="text-lg text-gray-500 mb-2">{currentItem.zh}</h3>
                    <button
                      onClick={() => speak(currentItem.en)}
                      className="mb-4 flex items-center justify-center gap-2 px-4 py-2 bg-sky-100 text-sky-600 rounded-full hover:bg-sky-200 transition-all"
                    >
                      <Icons.Volume2 size={20} />
                      <span className="font-bold text-sm">先聽發音</span>
                    </button>
                    <h2 className="text-3xl font-bold text-gray-800 mb-2 font-serif text-center">{currentItem.en}</h2>

                    <div className="w-full">
                      <SpeechEvaluator targetText={currentItem.en} onSuccess={() => advance(true)} />
                    </div>

                    <button
                      onClick={() => advance(false)}
                      className="mt-6 text-gray-400 text-sm hover:text-gray-600 underline"
                    >
                      麥克風偵測不到 / 跳過這題
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // 5a. 排字挑戰 (排得出來) / 5b. 拼字挑戰 (拼得出來)
          if (mode === 'arrange' || mode === 'spell') {
            const isArrange = mode === 'arrange';
            const stageColor = isArrange ? 'amber' : 'violet';
            const showSummary = spellingIndex >= spellingQueue.length;
            const reInit = () => (isArrange ? initArrange(currentGrade, currentTopic) : initSpell(currentGrade, currentTopic));

            if (showSummary) {
                return (
                    <div className={`min-h-screen bg-${stageColor}-50 font-sans pb-20`}>
                        <Header title="練習結果" onBack={() => setMode('learn_items')} />
                        <div className="p-8 max-w-md mx-auto text-center mt-10 bg-white rounded-3xl shadow-xl">
                            <div className="text-6xl mb-4">{isArrange ? '🧩' : '📝'}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">
                                {isArrange ? '排字關卡完成！' : '拼字關卡完成！'}
                            </h2>
                            <p className="text-xl text-gray-600 mb-6">
                                答對題數: <span className="text-green-600 font-bold text-3xl">{spellingStats.correct}</span> / {spellingQueue.length}
                            </p>
                            <p className="text-sm text-gray-400 mb-6">已記錄到你的學習護照，老師可以看到囉！</p>
                            <button
                                onClick={reInit}
                                className={`w-full py-3 bg-${stageColor}-500 text-white rounded-xl font-bold shadow mb-3 hover:bg-${stageColor}-600`}
                            >
                                再玩一次
                            </button>
                            <button
                                onClick={() => setMode('learn_items')}
                                className="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-bold shadow hover:bg-gray-300"
                            >
                                回到學習
                            </button>
                        </div>
                    </div>
                )
            }

            const currentItem = spellingQueue[spellingIndex];
            const isSentenceMode = currentItem.en.includes(' ');

            return (
              <div className={`min-h-screen bg-${stageColor}-50 font-sans pb-20`}>
                <Header
                  title={isArrange ? (isSentenceMode ? '句子重組 (排得出來)' : '字母重組 (排得出來)') : '拼字挑戰 (拼得出來)'}
                  subtitle={`Question ${spellingIndex + 1} / ${spellingQueue.length}`}
                  onBack={() => setMode('learn_items')}
                />

                <div className="p-6 max-w-lg mx-auto flex flex-col items-center gap-6 mt-4">
                    <div className="bg-white p-8 rounded-3xl shadow-lg w-full flex flex-col items-center relative overflow-hidden">
                        <div className={`absolute top-0 left-0 w-full h-2 bg-${stageColor}-200`}>
                            <div className={`h-full bg-${stageColor}-500 transition-all duration-500`} style={{ width: `${((spellingIndex)/spellingQueue.length)*100}%`}}></div>
                        </div>

                        <div className="text-6xl mb-4 animate-bounce-slow">{getIcon(currentItem.en)}</div>
                        <h3 className="text-2xl font-bold text-gray-800 mb-6">{currentItem.zh}</h3>

                        <button
                            onClick={() => speak(currentItem.en)}
                            className="mb-6 flex items-center justify-center gap-2 w-full max-w-xs px-4 py-2 bg-sky-100 text-sky-600 rounded-full hover:bg-sky-200 transition-all mx-auto"
                        >
                            <Icons.Volume2 size={24} />
                            <span className="font-bold">聽發音 (Listen)</span>
                        </button>

                        {isArrange ? (
                            <div className="w-full">
                                <div className={`
                                    min-h-[80px] w-full bg-${stageColor}-50 rounded-xl border-2 border-dashed flex flex-wrap gap-2 p-3 items-center justify-center mb-6 transition-all
                                    ${spellingFeedback === 'correct' ? 'border-green-400 bg-green-50' : `border-${stageColor}-300`}
                                    ${spellingFeedback === 'wrong' ? 'border-red-400 bg-red-50 animate-shake' : ''}
                                `}>
                                    {scrambleParts.placed.length === 0 && <span className="text-gray-400 text-sm">{isSentenceMode ? '請依序點擊下方的單字...' : '請依序點擊下方的字母...'}</span>}
                                    {scrambleParts.placed.map((word, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleScrambleDeselect(word, idx)}
                                            className={`bg-white ${isSentenceMode ? 'px-3 py-1' : 'w-10 h-10'} rounded-lg shadow border border-${stageColor}-100 text-${stageColor}-700 font-bold hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-all`}
                                        >
                                            {word}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex flex-wrap justify-center gap-3">
                                    {scrambleParts.available.map((word, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleScrambleSelect(word, idx)}
                                            className={`bg-${stageColor}-100 ${isSentenceMode ? 'px-4 py-2' : 'w-10 h-10'} rounded-lg text-${stageColor}-800 font-bold shadow-sm hover:bg-${stageColor}-200 hover:scale-105 active:scale-95 transition-all`}
                                        >
                                            {word}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="w-full">
                                <div className="bg-violet-50 px-6 py-3 rounded-xl mb-6 border border-violet-100">
                                    <p className="text-sm text-violet-400 font-bold uppercase tracking-wider mb-1 text-center">HINT</p>
                                    <p className="text-3xl font-mono text-violet-600 font-bold tracking-widest text-center">
                                        {getSpellingHint(spellableForm(currentItem.en))}
                                    </p>
                                </div>
                                <div className="w-full relative">
                                    <input
                                        type="text"
                                        value={userSpelling}
                                        onChange={(e) => {
                                            if (spellingFeedback !== 'correct') {
                                                setUserSpelling(e.target.value);
                                                if (spellingFeedback === 'wrong') setSpellingFeedback('idle');
                                            }
                                        }}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                if (spellingFeedback !== 'correct') checkWordSpelling();
                                                else if (spellingFeedback === 'correct') nextQuestion();
                                            }
                                        }}
                                        placeholder="Type English..."
                                        className={`
                                            w-full p-4 text-center text-xl border-2 rounded-xl outline-none transition-all font-bold
                                            ${spellingFeedback === 'idle' ? 'border-gray-300 focus:border-violet-500' : ''}
                                            ${spellingFeedback === 'correct' ? 'border-green-500 bg-green-50 text-green-700' : ''}
                                            ${spellingFeedback === 'wrong' ? 'border-red-500 bg-red-50 text-red-700 animate-shake' : ''}
                                        `}
                                        disabled={spellingFeedback === 'correct'}
                                        autoFocus
                                    />
                                </div>
                            </div>
                        )}

                        <div className="mt-8 w-full">
                            {spellingFeedback === 'correct' ? (
                                 <button
                                    onClick={nextQuestion}
                                    className="w-full py-4 bg-green-500 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-green-600 active:scale-95 transition-all flex items-center justify-center gap-2"
                                >
                                    下一題 (Next)
                                </button>
                            ) : (
                                !isArrange ? (
                                     <button
                                        onClick={checkWordSpelling}
                                        className="w-full py-4 bg-violet-600 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-violet-700 active:scale-95 transition-all"
                                    >
                                        檢查答案 (Check)
                                    </button>
                                ) : (
                                    spellingFeedback === 'wrong' && (
                                        <button
                                            onClick={() => {
                                                const parts = isSentenceMode ? currentItem.en.split(' ') : currentItem.en.split('');
                                                setScrambleParts({ available: parts.sort(() => Math.random() - 0.5), placed: [] });
                                                setSpellingFeedback('idle');
                                            }}
                                            className="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 flex items-center justify-center gap-2"
                                        >
                                            <Icons.RotateCcw size={18}/> 重置 (Reset)
                                        </button>
                                    )
                                )
                            )}
                        </div>
                    </div>
                </div>
              </div>
            );
          }

          // 5c. 聽力測驗 (聽得懂) / 5d. 閱讀理解測驗 (看得懂) / 5e. 加強複習 (錯題本)
          if (mode === 'listen_quiz' || mode === 'read_quiz' || mode === 'mistake_review') {
            const isListen = mode === 'listen_quiz';
            const isReview = mode === 'mistake_review';
            const stageColor = isReview ? 'pink' : isListen ? 'sky' : 'emerald';
            const showSummary = quizIndex >= quizQueue.length;

            if (showSummary) {
              if (isReview) {
                const allCleared = quizQueue.length > 0 && quizScore === quizQueue.length;
                return (
                  <div className={`min-h-screen bg-${stageColor}-50 font-sans pb-20`}>
                    <Header title="複習結果" onBack={() => setMode('my_passport')} />
                    <div className="p-8 max-w-md mx-auto text-center mt-10 bg-white rounded-3xl shadow-xl">
                      <div className="text-6xl mb-4">{allCleared ? '🎉' : '💪'}</div>
                      <h2 className="text-2xl font-bold text-gray-800 mb-2">{allCleared ? '太棒了，都複習完了！' : '再加油一下！'}</h2>
                      <p className="text-xl text-gray-600 mb-2">
