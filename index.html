                        這次答對: <span className="font-bold text-3xl text-green-600">{quizScore}</span> / {quizQueue.length}
                      </p>
                      <p className="text-sm text-gray-400 mb-6">
                        {allCleared ? '錯題本已經清空囉！' : '答對的題目已經從錯題本移除，還沒答對的下次會再出現'}
                      </p>
                      <button
                        onClick={() => setMode('my_passport')}
                        className={`w-full py-3 bg-${stageColor}-500 text-white rounded-xl font-bold shadow hover:bg-${stageColor}-600`}
                      >
                        回到我的學習護照
                      </button>
                    </div>
                  </div>
                );
              }
              const passThreshold = Math.ceil(quizQueue.length * 0.8);
              const passed = quizScore >= passThreshold;
              return (
                <div className={`min-h-screen bg-${stageColor}-50 font-sans pb-20`}>
                  <Header title="測驗結果" onBack={() => setMode('learn_items')} />
                  <div className="p-8 max-w-md mx-auto text-center mt-10 bg-white rounded-3xl shadow-xl">
                    <div className="text-6xl mb-4">{passed ? '🎉' : '💪'}</div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">{passed ? '過關了！' : '再加油一下！'}</h2>
                    <p className="text-xl text-gray-600 mb-2">
                      答對題數: <span className={`font-bold text-3xl ${passed ? 'text-green-600' : 'text-orange-500'}`}>{quizScore}</span> / {quizQueue.length}
                    </p>
                    <p className="text-sm text-gray-400 mb-6">
                      {passed ? '已記錄到你的學習護照，下一關解鎖囉！' : `答對 ${passThreshold} 題以上才能過關解鎖下一關`}
                    </p>
                    <button
                      onClick={() => initQuiz(quizStageName, currentGrade, currentTopic)}
                      className={`w-full py-3 bg-${stageColor}-500 text-white rounded-xl font-bold shadow mb-3 hover:bg-${stageColor}-600`}
                    >
                      再試一次
                    </button>
                    <button
                      onClick={() => setMode('learn_items')}
                      className="w-full py-3 bg-gray-200 text-gray-700 rounded-xl font-bold shadow hover:bg-gray-300"
                    >
                      回到學習
                    </button>
                  </div>
                </div>
              );
            }

            const currentItem = quizQueue[quizIndex];
            return (
              <div className={`min-h-screen bg-${stageColor}-50 font-sans pb-20`}>
                <Header
                  title={isReview ? '加強複習 (錯題本)' : isListen ? '聽力測驗 (聽得懂)' : '閱讀理解 (看得懂)'}
                  subtitle={`Question ${quizIndex + 1} / ${quizQueue.length}　答對 ${quizScore} 題`}
                  onBack={() => setMode(isReview ? 'my_passport' : 'learn_items')}
                />
                <div className="p-6 max-w-lg mx-auto flex flex-col items-center gap-6 mt-4">
                  <div className="bg-white p-8 rounded-3xl shadow-lg w-full flex flex-col items-center relative overflow-hidden">
                    <div className={`absolute top-0 left-0 w-full h-2 bg-${stageColor}-200`}>
                      <div className={`h-full bg-${stageColor}-500 transition-all duration-500`} style={{ width: `${(quizIndex/quizQueue.length)*100}%`}}></div>
                    </div>

                    {isListen ? (
                      <button
                        onClick={() => speak(currentItem.en)}
                        className="mb-6 mt-2 flex flex-col items-center justify-center gap-2 w-32 h-32 rounded-full bg-sky-100 hover:bg-sky-200 transition-all animate-pulse-fast"
                      >
                        <Icons.Volume2 size={48} className="text-sky-600" />
                        <span className="text-xs font-bold text-sky-500">點擊再聽一次</span>
                      </button>
                    ) : (
                      <>
                        <h3 className="text-4xl font-bold text-gray-800 mb-2 mt-4 font-serif text-center">{currentItem.en}</h3>
                        {isReview && (
                          <button
                            onClick={() => speak(currentItem.en)}
                            className="mb-6 flex items-center justify-center gap-2 px-4 py-2 bg-pink-100 text-pink-600 rounded-full hover:bg-pink-200 transition-all"
                          >
                            <Icons.Volume2 size={18} /> <span className="font-bold text-sm">聽發音</span>
                          </button>
                        )}
                      </>
                    )}

                    <p className={`text-sm text-gray-400 mb-4 ${isListen ? '' : 'mt-2'}`}>
                      {quizFeedback === 'idle' ? '請選出正確的中文意思，選好後按「確認送出答案」' : '請選出正確的中文意思'}
                    </p>
                    <div className="w-full grid grid-cols-1 gap-3">
                      {quizChoices.map((choice, idx) => {
                        const isCorrectChoice = choice === currentItem.zh;
                        const isSelected = choice === quizSelected;
                        let style = 'bg-gray-50 border-gray-200 hover:border-' + stageColor + '-300';
                        if (quizFeedback !== 'idle') {
                          if (isCorrectChoice) style = 'bg-green-50 border-green-400 text-green-700';
                          else if (isSelected) style = 'bg-red-50 border-red-400 text-red-600';
                          else style = 'bg-gray-50 border-gray-100 text-gray-300';
                        } else if (isSelected) {
                          style = `bg-${stageColor}-50 border-${stageColor}-500 text-${stageColor}-700 ring-2 ring-${stageColor}-200`;
                        }
                        return (
                          <button
                            key={idx}
                            disabled={quizFeedback !== 'idle'}
                            onClick={() => selectQuizChoice(choice)}
                            className={`w-full p-4 rounded-xl border-2 font-bold text-lg transition-all ${style}`}
                          >
                            {choice}
                          </button>
                        );
                      })}
                    </div>

                    {quizFeedback === 'idle' ? (
                      <button
                        onClick={submitQuizAnswer}
                        disabled={quizSelected === null}
                        className={`mt-6 w-full py-4 rounded-xl font-bold text-lg shadow-lg transition-all ${
                          quizSelected === null
                            ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                            : `bg-${stageColor}-500 text-white hover:bg-${stageColor}-600 active:scale-95`
                        }`}
                      >
                        確認送出答案
                      </button>
                    ) : (
                      <button
                        onClick={nextQuizQuestion}
                        className="mt-6 w-full py-4 bg-green-500 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-green-600 active:scale-95 transition-all"
                      >
                        下一題 (Next)
                      </button>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          // 6. 綜合挑戰：選擇年級
          if (mode === 'challenge_select') {
              return (
                  <div className="min-h-screen bg-orange-50 font-sans">
                      <Header title="綜合挑戰" subtitle="選擇你要挑戰的範圍" onBack={() => setMode('menu')} />
                      <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                        <button
                            onClick={() => initChallenge('ALL')}
                            className="bg-gradient-to-r from-red-500 to-orange-500 text-white p-8 rounded-2xl shadow-lg border-b-8 border-red-700 hover:translate-y-[-2px] transition-all flex flex-col items-center gap-3 md:col-span-2"
                        >
                            <Icons.Zap size={40} className="animate-pulse" />
                            <span className="text-2xl font-bold">全部年級大挑戰 (All Grades)</span>
                            <span className="text-red-100">隨機抽取所有範圍的單字與句型</span>
                        </button>
                        {Object.keys(curriculumData).map((grade) => (
                            <button
                                key={grade}
                                onClick={() => initChallenge(grade)}
                                className="bg-white p-6 rounded-2xl shadow border-b-4 border-orange-200 hover:border-orange-400 hover:translate-y-[-2px] transition-all flex flex-col items-center gap-2 text-orange-800"
                            >
                                <span className="text-xl font-bold">{grade}</span>
                                <span className="text-sm text-gray-500">僅限此年級範圍</span>
                            </button>
                        ))}
                      </div>
                  </div>
              )
          }

          // 7. 綜合挑戰：遊戲中
          if (mode === 'challenge_play') {
              if (challengeIndex >= 10) {
                  return (
                    <div className="min-h-screen bg-orange-50 font-sans pb-20">
                        <Header title="挑戰結束" onBack={() => setMode('challenge_select')} />
                        <div className="p-8 max-w-md mx-auto text-center mt-10 bg-white rounded-3xl shadow-xl border-4 border-orange-100">
                            <div className="text-6xl mb-4 text-yellow-500 animate-bounce"><Icons.Trophy size={80} fill="currentColor" className="mx-auto" /></div>
                            <h2 className="text-3xl font-bold text-orange-600 mb-2">Challenge Complete!</h2>
                            <p className="text-gray-600 mb-6 font-bold">挑戰範圍: {challengeGrade === 'ALL' ? '全部年級' : challengeGrade}</p>
                            
                            <div className="bg-orange-50 rounded-xl p-6 mb-8">
                                <p className="text-xl text-gray-700 mb-2">你的得分</p>
                                <p className="text-5xl font-bold text-orange-500">{challengeScore} <span className="text-2xl text-gray-400">/ 10</span></p>
                            </div>

                            <button 
                                onClick={() => initChallenge(challengeGrade)}
                                className="w-full py-4 bg-orange-500 text-white rounded-xl font-bold text-lg shadow-lg mb-3 hover:bg-orange-600 transition-colors"
                            >
                                再挑戰一次
                            </button>
                            <button 
                                onClick={() => setMode('menu')}
                                className="w-full py-4 bg-gray-200 text-gray-700 rounded-xl font-bold text-lg shadow hover:bg-gray-300 transition-colors"
                            >
                                回到首頁
                            </button>
                        </div>
                    </div>
                  );
              }

              const q = challengeQuestions[challengeIndex];
              const isSentence = q.en.includes(' ');

              return (
                <div className="min-h-screen bg-slate-900 font-sans text-slate-100 pb-20 flex flex-col">
                    <div className="p-4 flex items-center justify-between bg-slate-800 shadow-md">
                        <button onClick={() => setMode('challenge_select')} className="text-slate-400 hover:text-white">
                            <Icons.X size={28} />
                        </button>
                        <div className="font-bold text-xl text-orange-400">Question {challengeIndex + 1} / 10</div>
                        <div className="w-8"></div>
                    </div>

                    <div className="w-full h-1.5 bg-slate-700">
                        <div className="h-full bg-gradient-to-r from-orange-400 to-red-500 transition-all duration-300" style={{ width: `${(challengeIndex / 10) * 100}%`}}></div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-6">
                        <div className="bg-slate-800 w-full max-w-lg rounded-3xl p-8 shadow-2xl flex flex-col items-center relative border border-slate-700">
                            
                            <div className={`absolute -top-4 px-4 py-1 rounded-full font-bold text-sm shadow-lg border-2 border-slate-800 ${q.type === 'speak' ? 'bg-sky-400 text-sky-900' : 'bg-violet-400 text-violet-900'}`}>
                                {q.type === 'speak' ? '🗣️ 口說挑戰 (Speak)' : '📝 聽寫挑戰 (Spell)'}
                            </div>

                            <div className="text-6xl mb-6 mt-4">{getIcon(q.en)}</div>
                            <h3 className="text-3xl font-bold text-white mb-8 text-center">{q.zh}</h3>

                            {q.type === 'speak' && (
                                <div className="w-full flex flex-col items-center">
                                    <p className="text-2xl text-sky-300 font-bold mb-6 text-center">{q.en}</p>
                                    <div className="w-full bg-slate-700 rounded-xl p-4">
                                        <SpeechEvaluator 
                                            targetText={q.en} 
                                            onSuccess={() => {
                                                if (chFeedback !== 'correct') {
                                                    setChFeedback('correct');
                                                    setTimeout(() => nextChallengeQuestion(true), 1500);
                                                }
                                            }}
                                        />
                                    </div>
                                </div>
                            )}

                            {q.type === 'spell' && (
                                <div className="w-full flex flex-col items-center">
                                    <button
                                        onClick={() => speak(q.en)}
                                        className="mb-6 flex items-center justify-center gap-2 w-full max-w-xs px-4 py-3 bg-violet-600/30 text-violet-300 rounded-full hover:bg-violet-600/50 transition-all border border-violet-500/30"
                                    >
                                        <Icons.Volume2 size={24} />
                                        <span className="font-bold">聽發音提示</span>
                                    </button>

                                    {isSentence ? (
                                        <div className="w-full">
                                            <div className={`
                                                min-h-[80px] w-full bg-slate-900 rounded-xl border-2 border-dashed flex flex-wrap gap-2 p-3 items-center justify-center mb-6 transition-all
                                                ${chFeedback === 'correct' ? 'border-green-500 bg-green-900/30' : 'border-slate-600'}
                                                ${chFeedback === 'wrong' ? 'border-red-500 bg-red-900/30 animate-shake' : ''}
                                            `}>
                                                {chScrambleParts.placed.length === 0 && <span className="text-slate-500 text-sm">點擊下方單字重組句子</span>}
                                                {chScrambleParts.placed.map((word, idx) => (
                                                    <button key={idx} onClick={() => handleChallengeScrambleDeselect(word, idx)} className="bg-slate-700 px-3 py-1 rounded-lg text-white font-bold hover:bg-red-500/50 transition-all">
                                                        {word}
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="flex flex-wrap justify-center gap-3">
                                                {chScrambleParts.available.map((word, idx) => (
                                                    <button key={idx} onClick={() => handleChallengeScrambleSelect(word, idx)} className="bg-violet-600 px-4 py-2 rounded-lg text-white font-bold shadow-sm hover:bg-violet-500 transition-all">
                                                        {word}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-full relative">
                                            <div className="bg-slate-900/50 px-6 py-3 rounded-xl mb-6 border border-slate-700">
                                                <p className="text-sm text-slate-500 font-bold uppercase tracking-wider mb-1 text-center">HINT</p>
                                                <p className="text-3xl font-mono text-violet-400 font-bold tracking-widest text-center">
                                                    {getSpellingHint(spellableForm(q.en))}
                                                </p>
                                            </div>
                                            <input 
                                                type="text" 
                                                value={chUserSpelling}
                                                onChange={(e) => {
                                                    if (chFeedback !== 'correct') {
                                                        setChUserSpelling(e.target.value);
                                                        if (chFeedback === 'wrong') setChFeedback('idle');
                                                    }
                                                }}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter' && chFeedback !== 'correct') checkChallengeSpelling();
                                                }}
                                                placeholder="輸入英文單字..."
                                                className={`
                                                    w-full p-4 text-center text-xl bg-slate-900 border-2 rounded-xl outline-none transition-all font-bold text-white
                                                    ${chFeedback === 'idle' ? 'border-slate-600 focus:border-violet-500' : ''}
                                                    ${chFeedback === 'correct' ? 'border-green-500 text-green-400' : ''}
                                                    ${chFeedback === 'wrong' ? 'border-red-500 text-red-400 animate-shake' : ''}
                                                `}
                                                disabled={chFeedback === 'correct'}
                                                autoFocus
                                            />
                                            {chFeedback !== 'correct' && (
                                                <button onClick={checkChallengeSpelling} className="mt-4 w-full py-3 bg-violet-600 text-white rounded-xl font-bold hover:bg-violet-500 transition-colors">
                                                    檢查答案
                                                </button>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            {chFeedback === 'correct' && (
                                <div className="absolute inset-0 bg-green-500/20 rounded-3xl flex items-center justify-center backdrop-blur-sm z-10">
                                    <div className="bg-green-500 text-white px-6 py-3 rounded-full font-bold text-2xl shadow-xl flex items-center gap-2 animate-bounce">
                                        <Icons.Check /> Correct!
                                    </div>
                                </div>
                            )}
                        </div>

                        {chFeedback !== 'correct' && (
                            <button 
                                onClick={() => nextChallengeQuestion(false)}
                                className="mt-8 text-slate-500 font-bold hover:text-slate-300 transition-colors"
                            >
                                不會這題，跳過 (Skip)
                            </button>
                        )}
                    </div>
                </div>
              );
          }

          return null;
        };

        // =====================================================================
        // 以下為帳號登入 / 老師後台相關元件
        // =====================================================================

        const FirebaseNotConfiguredScreen = () => (
          <div className="min-h-screen bg-red-50 flex items-center justify-center p-6 font-sans">
            <div className="max-w-lg bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-4">⚙️</div>
              <h1 className="text-2xl font-bold text-red-600 mb-3">尚未設定 Firebase</h1>
              <p className="text-gray-600 leading-relaxed">
                這個系統需要連接 Firebase 才能記錄學生的學習紀錄與點數。
                請依照隨附的 <code className="bg-gray-100 px-1 rounded">SETUP_GUIDE.md</code> 建立 Firebase 專案，
                並把設定值貼到 <code className="bg-gray-100 px-1 rounded">index.html</code> 開頭的 <code className="bg-gray-100 px-1 rounded">firebaseConfig</code> 裡。
              </p>
            </div>
          </div>
        );

        const RoleSelectScreen = ({ onPick }) => (
          <div className="min-h-screen bg-sky-50 flex items-center justify-center p-6 font-sans">
            <div className="max-w-md w-full text-center">
              <div className="text-6xl mb-3">🛂</div>
              <h1 className="text-2xl font-bold text-gray-800 mb-1">鳥嶼國小英語學習護照</h1>
              <p className="text-gray-500 mb-8">請選擇你的身分登入</p>
              <div className="grid grid-cols-1 gap-4">
                <button onClick={() => onPick('student')} className="bg-white p-6 rounded-2xl shadow-lg border-b-8 border-sky-300 hover:translate-y-[-2px] transition-all flex items-center gap-4">
                  <span className="text-4xl">🧒</span>
                  <div className="text-left">
                    <div className="font-bold text-xl text-gray-800">我是學生</div>
                    <div className="text-sm text-gray-400">班級 + 座號 + 密碼登入</div>
                  </div>
                </button>
                <button onClick={() => onPick('teacher')} className="bg-white p-6 rounded-2xl shadow-lg border-b-8 border-orange-300 hover:translate-y-[-2px] transition-all flex items-center gap-4">
                  <span className="text-4xl">🧑‍🏫</span>
                  <div className="text-left">
                    <div className="font-bold text-xl text-gray-800">我是老師</div>
                    <div className="text-sm text-gray-400">查看學生進度 / 加點</div>
                  </div>
                </button>
              </div>
            </div>
          </div>
        );

        const StudentLoginScreen = ({ classesList, onLogin, onBack, error, busy }) => {
          const effectiveClasses = mergeClasses(classesList);
          const [className, setClassName] = useState(effectiveClasses[0] || '');
          const [seat, setSeat] = useState('');
          const [password, setPassword] = useState('');
          const [name, setName] = useState('');
          const [englishName, setEnglishName] = useState('');

          useEffect(() => {
            if (!className && effectiveClasses.length > 0) setClassName(effectiveClasses[0]);
          }, [classesList]);

          const seatCount = CLASS_SEAT_COUNTS[className] || 40;
          const seatOptions = Array.from({ length: seatCount }, (_, i) => String(i + 1));

          // 班級一改變，座號要重設成新班級的第一號，不然會殘留舊班級選到的號碼
          // （例如選了六年級6號，切到只有2個人的四年級，殘留的「6」會是不存在的座號）。
          useEffect(() => {
            setSeat(prev => (seatOptions.includes(prev) ? prev : (seatOptions[0] || '')));
          }, [className]);

          return (
            <div className="min-h-screen bg-sky-50 flex items-center justify-center p-6 font-sans">
              <div className="max-w-sm w-full bg-white rounded-3xl shadow-xl p-8">
                <button onClick={onBack} className="text-gray-400 hover:text-gray-600 mb-4 flex items-center gap-1 text-sm">
                  <Icons.ArrowLeft size={16} /> 返回
                </button>
                <h2 className="text-xl font-bold text-gray-800 mb-1 text-center">學生登入</h2>
                <p className="text-xs text-gray-400 mb-6 text-center">第一次使用會自動幫你建立帳號</p>

                <label className="block text-sm font-bold text-gray-500 mb-1">班級</label>
                <select value={className} onChange={e => setClassName(e.target.value)} className="w-full p-3 mb-4 border-2 border-gray-200 rounded-xl outline-none focus:border-sky-400">
                  {effectiveClasses.map(c => <option key={c} value={c}>{c}</option>)}
                </select>

                <label className="block text-sm font-bold text-gray-500 mb-1">座號</label>
                <select value={seat} onChange={e => setSeat(e.target.value)} className="w-full p-3 mb-4 border-2 border-gray-200 rounded-xl outline-none focus:border-sky-400">
                  {seatOptions.map(s => <option key={s} value={s}>{s} 號</option>)}
                </select>

                <label className="block text-sm font-bold text-gray-500 mb-1">密碼</label>
                <input value={password} onChange={e => setPassword(e.target.value)} type="password" placeholder="第一次使用請自己設一組 (至少6碼)" className="w-full p-3 mb-4 border-2 border-gray-200 rounded-xl outline-none focus:border-sky-400" />

                <label className="block text-sm font-bold text-gray-500 mb-1">姓名 <span className="font-normal text-gray-300">(只有第一次登入需要填)</span></label>
                <input value={name} onChange={e => setName(e.target.value)} placeholder="你的名字" className="w-full p-3 mb-4 border-2 border-gray-200 rounded-xl outline-none focus:border-sky-400" />

                <label className="block text-sm font-bold text-gray-500 mb-1">英文名字 <span className="font-normal text-gray-300">(選填，之後可以在「拼得出來」關卡練習拼出自己的名字)</span></label>
                <input value={englishName} onChange={e => setEnglishName(e.target.value)} placeholder="例如：Amy" className="w-full p-3 mb-6 border-2 border-gray-200 rounded-xl outline-none focus:border-sky-400" />

                {error && <p className="text-red-500 text-sm mb-4 text-center">{error}</p>}

                <button
                  disabled={busy || !className || !seat || password.length < 6}
                  onClick={() => onLogin(className, seat, password, name, englishName)}
                  className="w-full py-3 bg-sky-500 hover:bg-sky-600 disabled:opacity-50 text-white rounded-xl font-bold shadow-lg"
                >
                  {busy ? '登入中...' : '登入 / 開始使用'}
                </button>
                {password.length > 0 && password.length < 6 && (
                  <p className="text-xs text-gray-400 mt-2 text-center">密碼至少要 6 個字元喔</p>
                )}
              </div>
            </div>
          );
        };

        const TeacherLoginScreen = ({ onLogin, onBack, error, busy }) => {
          const [name, setName] = useState('');
          const [password, setPassword] = useState('');
          return (
            <div className="min-h-screen bg-orange-50 flex items-center justify-center p-6 font-sans">
              <div className="max-w-sm w-full bg-white rounded-3xl shadow-xl p-8">
                <button onClick={onBack} className="text-gray-400 hover:text-gray-600 mb-4 flex items-center gap-1 text-sm">
                  <Icons.ArrowLeft size={16} /> 返回
                </button>
                <h2 className="text-xl font-bold text-gray-800 mb-6 text-center">老師登入</h2>

                <label className="block text-sm font-bold text-gray-500 mb-2">請選擇你是哪一位老師</label>
                <div className="grid grid-cols-3 gap-2 mb-6">
                  {TEACHER_NAMES.map(n => (
                    <button
                      key={n}
                      onClick={() => setName(n)}
                      className={`py-3 rounded-xl font-bold border-2 transition-all ${name === n ? 'bg-orange-500 text-white border-orange-500' : 'bg-white text-gray-600 border-gray-200 hover:border-orange-300'}`}
                    >
                      {n}
                    </button>
                  ))}
                </div>

                <label className="block text-sm font-bold text-gray-500 mb-1">密碼</label>
                <input value={password} onChange={e => setPassword(e.target.value)} type="password" placeholder="共用密碼" className="w-full p-3 mb-6 border-2 border-gray-200 rounded-xl outline-none focus:border-orange-400" />

                {error && <p className="text-red-500 text-sm mb-4 text-center">{error}</p>}

                <button
                  disabled={busy || !name || !password}
                  onClick={() => onLogin(name, password)}
                  className="w-full py-3 bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white rounded-xl font-bold shadow-lg"
                >
                  {busy ? '登入中...' : '登入'}
                </button>
              </div>
            </div>
          );
        };

        // --- 老師後台：班級管理 + 學生名冊 + 進度儀表板 + 加點 ---
        const TeacherDashboard = ({ teacherName, classesList, onAddClass, onAddStudent, onStampTask, onAwardPoints, onResetPassword, onOverrideSpeak, onAddCustomWord, onExit }) => {
          const [selectedClass, setSelectedClass] = useState(classesList[0] || '');
          const [students, setStudents] = useState([]);
          const [pointsMap, setPointsMap] = useState({});
          const [loading, setLoading] = useState(false);
          const [newClassName, setNewClassName] = useState('');
          const [showAddStudent, setShowAddStudent] = useState(false);
          const [newStudent, setNewStudent] = useState({ seat: '', name: '', pin: '' });
          const [addStudentError, setAddStudentError] = useState('');
          const [addStudentBusy, setAddStudentBusy] = useState(false);
          const [awardTarget, setAwardTarget] = useState(null);
          const [awardAmount, setAwardAmount] = useState(1);
          const [awardReason, setAwardReason] = useState('');
          const [stampingKey, setStampingKey] = useState(null); // `${studentId}__${topicKey}` 防止重複點擊
          const [resetTarget, setResetTarget] = useState(null);
          const [resetPassword, setResetPassword] = useState('');
          const [resetBusy, setResetBusy] = useState(false);
          const [resetError, setResetError] = useState('');
          const [resetDoneMsg, setResetDoneMsg] = useState('');
          const [showAddWord, setShowAddWord] = useState(false);
          const [newWord, setNewWord] = useState({ grade: Object.keys(curriculumData)[0] || '', topic: '', en: '', zh: '' });
          const [addWordBusy, setAddWordBusy] = useState(false);
          const [addWordMsg, setAddWordMsg] = useState('');

          useEffect(() => {
            if (!selectedClass) { setStudents([]); return; }
            setLoading(true);
            const unsub = db.collection('students').where('className', '==', selectedClass)
              .onSnapshot(async (snap) => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                list.sort((a, b) => (Number(a.seatNumber) || 0) - (Number(b.seatNumber) || 0));
                setStudents(list);
                setLoading(false);
                // 逐一算出每位學生的總點數 (加總 pointLogs)
                const entries = await Promise.all(list.map(async (s) => {
                  const logsSnap = await db.collection('students').doc(s.id).collection('pointLogs').get();
                  let sum = 0;
                  logsSnap.forEach(d => { sum += (d.data().delta || 0); });
                  return [s.id, sum];
                }));
                setPointsMap(Object.fromEntries(entries));
              }, (err) => { console.error(err); setLoading(false); });
            return () => unsub();
          }, [selectedClass]);

          const handleAddClass = () => {
            if (!newClassName.trim()) return;
            onAddClass(newClassName.trim());
            setSelectedClass(newClassName.trim());
            setNewClassName('');
          };

          const handleAddStudent = async () => {
            setAddStudentError('');
            if (!newStudent.seat || !newStudent.name || newStudent.pin.length < 6) {
              setAddStudentError('請完整填寫座號、姓名，密碼至少 6 碼');
              return;
            }
            setAddStudentBusy(true);
            try {
              await onAddStudent(selectedClass, newStudent.seat, newStudent.name, newStudent.pin);
              setNewStudent({ seat: '', name: '', pin: '' });
              setShowAddStudent(false);
            } catch (e) {
              setAddStudentError(e.message || '新增失敗，請確認座號是否重複');
            }
            setAddStudentBusy(false);
          };

          const handleAddCustomWord = async () => {
            setAddWordMsg('');
            if (!newWord.grade || !newWord.topic.trim() || !newWord.en.trim() || !newWord.zh.trim()) {
              setAddWordMsg('請完整填寫年級、單元、英文、中文');
              return;
            }
            setAddWordBusy(true);
            try {
              await onAddCustomWord(newWord.grade, newWord.topic.trim(), newWord.en, newWord.zh);
              setAddWordMsg(`已新增「${newWord.en}」到「${newWord.topic.trim()}」單元！`);
              setNewWord(w => ({ ...w, en: '', zh: '' }));
            } catch (e) {
              setAddWordMsg(e.message || '新增失敗');
            }
            setAddWordBusy(false);
          };

          const submitAward = async () => {
            if (!awardTarget || !awardAmount) return;
            await onAwardPoints(awardTarget.id, awardAmount, awardReason, teacherName);
            setPointsMap(prev => ({ ...prev, [awardTarget.id]: (prev[awardTarget.id] || 0) + Number(awardAmount) }));
            setAwardTarget(null);
            setAwardAmount(1);
            setAwardReason('');
          };

          const handleStamp = async (student, tKey, grade, topic) => {
            const key = `${student.id}__${tKey}`;
            setStampingKey(key);
            try {
              await onStampTask(student.id, tKey, grade, topic, teacherName);
              setPointsMap(prev => ({ ...prev, [student.id]: (prev[student.id] || 0) + TASK_STAMP_POINTS }));
            } catch (err) {
              console.error('[nypspassport] 蓋章失敗:', err);
              alert('蓋章失敗，請檢查網路連線或稍後再試，如果一直失敗請確認 Firestore 安全規則是否已發布。');
            } finally {
              setStampingKey(null);
            }
          };

          // 口說關卡麥克風常常誤判，學生唸給老師聽、確認發音沒問題後，
          // 老師直接按這顆按鈕手動過關，不用真的靠麥克風偵測成功。
          const handleOverrideSpeak = async (student, tKey) => {
            const key = `${student.id}__${tKey}__speak`;
            setStampingKey(key);
            try {
              await onOverrideSpeak(student.id, tKey, teacherName);
            } catch (err) {
              console.error('[nypspassport] 口說過關失敗:', err);
              alert('操作失敗，請檢查網路連線或稍後再試，如果一直失敗請確認 Firestore 安全規則是否已發布。');
            } finally {
              setStampingKey(null);
            }
          };

          const submitResetPassword = async () => {
            if (!resetTarget || resetPassword.length < 6) return;
            setResetBusy(true); setResetError('');
            try {
              await onResetPassword(resetTarget, resetPassword);
              setResetDoneMsg(`已重置！請告訴 ${resetTarget.name} 新密碼：${resetPassword}`);
              setResetPassword('');
            } catch (e) {
              setResetError('重置失敗，請再試一次');
            }
            setResetBusy(false);
          };

          // 待關心名單：這個班級裡「完全還沒開始練習」或「超過 STALE_DAYS 天
          // 沒有任何關卡活動」的學生，讓老師一眼就能看出誰需要多關心一下。
          const attentionList = students.filter(s => {
            const progress = s.progress || {};
            if (Object.keys(progress).length === 0) return true;
            const lastDate = studentLastActivityDate(progress);
            if (!lastDate) return true;
            const days = (Date.now() - lastDate.getTime()) / (1000 * 60 * 60 * 24);
            return days >= STALE_DAYS;
          });

          // 全班常錯單字 Top 5：把每個學生的 mistakes 欄位彙總起來，
          // 依照答錯次數排序，讓老師知道全班共通的加強重點是什麼。
          const mistakeTally = {};
          students.forEach(s => {
            Object.values(s.mistakes || {}).forEach(m => {
              if (!m || !m.en) return;
              if (!mistakeTally[m.en]) mistakeTally[m.en] = { en: m.en, zh: m.zh, count: 0, studentCount: 0 };
              mistakeTally[m.en].count += (m.count || 1);
              mistakeTally[m.en].studentCount += 1;
            });
          });
          const topMistakes = Object.values(mistakeTally).sort((a, b) => b.count - a.count).slice(0, 5);

          return (
            <div className="min-h-screen bg-orange-50 font-sans pb-20">
              <Header
                title="老師後台"
                subtitle={teacherName}
                right={
                  <button onClick={onExit} className="p-2 hover:bg-sky-600 rounded-full transition-colors" title="登出">
                    <Icons.X size={20} />
                  </button>
                }
              />

              <div className="p-4 max-w-4xl mx-auto">
                <div className="bg-white rounded-2xl shadow p-4 mb-6 flex flex-wrap items-center gap-3">
                  <span className="font-bold text-gray-600">班級：</span>
                  {classesList.map(c => (
                    <button key={c} onClick={() => setSelectedClass(c)}
                      className={`px-4 py-2 rounded-full font-bold text-sm ${selectedClass === c ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-500 hover:bg-orange-100'}`}>
                      {c}
                    </button>
                  ))}
                  <div className="flex items-center gap-2 ml-auto">
                    <input value={newClassName} onChange={e => setNewClassName(e.target.value)} placeholder="新增班級名稱"
                      className="px-3 py-2 border-2 border-gray-200 rounded-full text-sm outline-none focus:border-orange-400" />
                    <button onClick={handleAddClass} className="px-3 py-2 bg-orange-100 text-orange-600 rounded-full font-bold text-sm hover:bg-orange-200">
                      + 新增班級
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow p-4 mb-6">
                  <div className="flex items-center justify-between mb-1">
                    <h3 className="font-bold text-gray-700 flex items-center gap-2"><Icons.BookOpen size={18} /> 自訂單字</h3>
                    <button onClick={() => setShowAddWord(v => !v)} className="text-sm font-bold text-orange-500 hover:underline">
                      {showAddWord ? '取消' : '+ 新增單字'}
                    </button>
                  </div>
                  <p className="text-xs text-gray-400 mb-2">可以加到現有單元 (單元名稱打得跟現有的一樣)，也可以打新的單元名稱來建立全新單元，學生馬上就會看到。</p>
                  {showAddWord && (
                    <div className="bg-orange-50 rounded-xl p-4 grid grid-cols-1 md:grid-cols-5 gap-2 items-end">
                      <div>
                        <label className="text-xs font-bold text-gray-400">年級</label>
                        <select value={newWord.grade} onChange={e => setNewWord(w => ({ ...w, grade: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none">
                          {Object.keys(curriculumData).map(g => <option key={g} value={g}>{g}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-gray-400">單元 (可打新的)</label>
                        <input list="topic-options" value={newWord.topic} onChange={e => setNewWord(w => ({ ...w, topic: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none" />
                        <datalist id="topic-options">
                          {Object.keys(curriculumData[newWord.grade] || {}).map(t => <option key={t} value={t} />)}
                        </datalist>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-gray-400">英文</label>
                        <input value={newWord.en} onChange={e => setNewWord(w => ({ ...w, en: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-gray-400">中文意思</label>
                        <input value={newWord.zh} onChange={e => setNewWord(w => ({ ...w, zh: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none" />
                      </div>
                      <button disabled={addWordBusy} onClick={handleAddCustomWord} className="py-2 bg-orange-500 text-white rounded-lg font-bold hover:bg-orange-600 disabled:opacity-50">
                        {addWordBusy ? '新增中...' : '確認新增'}
                      </button>
                      {addWordMsg && <p className="text-sm text-orange-600 md:col-span-5">{addWordMsg}</p>}
                    </div>
                  )}
                </div>

                {selectedClass && !loading && students.length > 0 && (attentionList.length > 0 || topMistakes.length > 0) && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    {attentionList.length > 0 && (
                      <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-4">
                        <h3 className="font-bold text-red-700 mb-1 flex items-center gap-2">
                          <span className="text-xl">🙋</span> 待關心名單
                        </h3>
                        <p className="text-xs text-red-500 mb-3">還沒開始練習，或超過 {STALE_DAYS} 天沒有任何關卡活動</p>
                        <div className="flex flex-wrap gap-2">
                          {attentionList.map(s => (
                            <span key={s.id} className="px-3 py-1.5 bg-white border-2 border-red-200 rounded-full text-red-600 font-bold text-sm">
                              {s.seatNumber}號 {s.name}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                    {topMistakes.length > 0 && (
                      <div className="bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-4">
                        <h3 className="font-bold text-indigo-700 mb-1 flex items-center gap-2">
                          <span className="text-xl">📊</span> 全班常錯 Top 5
                        </h3>
                        <p className="text-xs text-indigo-500 mb-3">彙整全班學生的錯題本，答錯次數最多的單字/句子</p>
                        <ol className="space-y-1">
                          {topMistakes.map((m, i) => (
                            <li key={m.en} className="flex items-center justify-between text-sm">
                              <span className="text-indigo-800"><span className="font-bold mr-1">{i + 1}.</span>{m.en}<span className="text-indigo-400 ml-1">({m.zh})</span></span>
                              <span className="text-indigo-500 font-bold">答錯 {m.count} 次 · {m.studentCount} 人</span>
                            </li>
                          ))}
                        </ol>
                      </div>
                    )}
                  </div>
                )}

                {selectedClass && (
                  <div className="bg-white rounded-2xl shadow p-4 mb-6">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-bold text-gray-700">{selectedClass} 學生名冊</h3>
                      <button onClick={() => setShowAddStudent(v => !v)} className="text-sm font-bold text-orange-500 hover:underline">
                        {showAddStudent ? '取消' : '+ 新增學生'}
                      </button>
                    </div>
                    {showAddStudent && (
                      <div className="bg-orange-50 rounded-xl p-4 mb-4 grid grid-cols-1 md:grid-cols-4 gap-2 items-end">
                        <div>
                          <label className="text-xs font-bold text-gray-400">座號</label>
                          <select value={newStudent.seat} onChange={e => setNewStudent(s => ({ ...s, seat: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none">
                            <option value="">請選擇</option>
                            {Array.from({ length: CLASS_SEAT_COUNTS[selectedClass] || 40 }, (_, i) => String(i + 1)).map(s => (
                              <option key={s} value={s}>{s} 號</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="text-xs font-bold text-gray-400">姓名</label>
                          <input value={newStudent.name} onChange={e => setNewStudent(s => ({ ...s, name: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none" />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-gray-400">密碼 (6碼以上)</label>
                          <input value={newStudent.pin} onChange={e => setNewStudent(s => ({ ...s, pin: e.target.value }))} className="w-full p-2 border-2 border-gray-200 rounded-lg outline-none" />
                        </div>
                        <button disabled={addStudentBusy} onClick={handleAddStudent} className="py-2 bg-orange-500 text-white rounded-lg font-bold hover:bg-orange-600 disabled:opacity-50">
                          {addStudentBusy ? '新增中...' : '確認新增'}
                        </button>
                        {addStudentError && <p className="text-red-500 text-xs md:col-span-4">{addStudentError}</p>}
                      </div>
                    )}

                    {loading ? (
                      <p className="text-gray-400 text-sm py-6 text-center">載入中...</p>
                    ) : students.length === 0 ? (
                      <p className="text-gray-400 text-sm py-6 text-center">這個班級還沒有學生，點上面「+ 新增學生」開始建立名冊吧！</p>
                    ) : (
                      <div className="space-y-3">
                        {students.map(s => {
                          const progress = s.progress || {};
                          const topicKeys = Object.keys(progress);
                          const pendingStamp = topicKeys.filter(tk => isTaskComplete(progress[tk]) && !progress[tk].stamped);
                          const stampedTasks = topicKeys.filter(tk => progress[tk].stamped);
                          // 已經蓋章的任務不會再算「進行中」，避免舊資料(六關上路前只有四關記錄)
                          // 蓋過章之後同時出現在兩邊。
                          const inProgressTasks = topicKeys.filter(tk => !isTaskComplete(progress[tk]) && !progress[tk].stamped);

                          return (
                            <div key={s.id} className="border border-gray-100 rounded-xl p-3">
                              <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                                <div className="flex items-center gap-3">
                                  <span className="w-8 h-8 rounded-full bg-orange-100 text-orange-600 font-bold flex items-center justify-center text-sm">{s.seatNumber}</span>
                                  <span className="font-bold text-gray-700">{s.name}</span>
                                  <span className="text-xs text-gray-400">已蓋章 {stampedTasks.length} 個任務</span>
                                </div>
                                <div className="flex items-center gap-3">
                                  <span className="flex items-center gap-1 text-yellow-600 font-bold text-sm">
                                    <Icons.Star size={16} fill="currentColor" /> {pointsMap[s.id] ?? '...'} 點
                                  </span>
                                  <button onClick={() => setAwardTarget(s)} className="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs font-bold hover:bg-gray-200">
                                    其他加點
                                  </button>
                                  <button
                                    onClick={() => { setResetTarget(s); setResetError(''); setResetDoneMsg(''); setResetPassword(''); }}
                                    className="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-full text-xs font-bold hover:bg-gray-200"
                                  >
                                    🔑 重置密碼
                                  </button>
                                </div>
                              </div>

                              {pendingStamp.length > 0 && (
                                <div className="mb-2 space-y-1.5">
                                  {pendingStamp.map(tk => {
                                    const [grade, topic] = tk.split('__');
                                    const key = `${s.id}__${tk}`;
                                    return (
                                      <div key={tk} className="flex items-center justify-between bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                                        <div className="flex items-center gap-2 text-sm">
                                          <span className="text-lg">🎯</span>
                                          <span className="font-bold text-amber-800">{topic?.split('(')[0]}</span>
                                          <span className="text-amber-500 text-xs">六關全過，可以蓋章囉！</span>
                                        </div>
                                        <button
                                          disabled={stampingKey === key}
                                          onClick={() => handleStamp(s, tk, grade, topic)}
                                          className="px-3 py-1.5 bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white rounded-full text-xs font-bold flex items-center gap-1 shadow"
                                        >
                                          🖋️ 蓋章 +{TASK_STAMP_POINTS}
                                        </button>
                                      </div>
                                    );
                                  })}
                                </div>
                              )}

                              {(stampedTasks.length > 0 || inProgressTasks.length > 0) && (
                                <div className="flex flex-wrap gap-2">
                                  {stampedTasks.map(tk => {
                                    const label = tk.split('__')[1] || tk;
                                    return (
                                      <div key={tk} className="text-[11px] bg-red-50 text-red-600 rounded-lg px-2 py-1 flex items-center gap-1 font-bold">
                                        <span>🏅</span><span>{label.split('(')[0]}</span>
                                      </div>
                                    );
                                  })}
                                  {inProgressTasks.map(tk => {
                                    const p = progress[tk];
                                    const label = tk.split('__')[1] || tk;
                                    const overrideKey = `${s.id}__${tk}__speak`;
                                    return (
                                      <div key={tk} className="text-[11px] bg-gray-50 rounded-lg px-2 py-1 flex items-center gap-1">
                                        <span className="text-gray-400">{label.split('(')[0]}</span>
                                        {STAGE_ORDER.map(st => (
                                          <span key={st} className={p[st] ? 'text-green-500' : 'text-gray-300'}>{STAGE_ICON[st]}</span>
                                        ))}
                                        {!p.speak && (
                                          <button
                                            disabled={stampingKey === overrideKey}
                                            onClick={() => handleOverrideSpeak(s, tk)}
                                            title="學生麥克風偵測不到時，唸給老師聽確認後手動過口說關"
                                            className="ml-1 px-1.5 py-0.5 bg-rose-100 text-rose-600 rounded font-bold hover:bg-rose-200 disabled:opacity-50"
                                          >
                                            ✅口說過關
                                          </button>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>
                              )}

                              {topicKeys.length === 0 && (
                                <p className="text-xs text-gray-300">還沒有開始任何任務</p>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {awardTarget && (
                <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-6 z-50">
                  <div className="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full">
                    <h3 className="font-bold text-lg text-gray-800 mb-4">給 {awardTarget.name} 加點</h3>
                    <label className="text-xs font-bold text-gray-400">點數 (可為負數以扣點)</label>
                    <input type="number" value={awardAmount} onChange={e => setAwardAmount(e.target.value)} className="w-full p-3 mb-3 border-2 border-gray-200 rounded-xl outline-none" />
                    <label className="text-xs font-bold text-gray-400">原因</label>
                    <input value={awardReason} onChange={e => setAwardReason(e.target.value)} placeholder="例如：課堂表現優異" className="w-full p-3 mb-4 border-2 border-gray-200 rounded-xl outline-none" />
                    <div className="flex gap-2">
                      <button onClick={() => setAwardTarget(null)} className="flex-1 py-2 bg-gray-100 text-gray-600 rounded-xl font-bold">取消</button>
                      <button onClick={submitAward} className="flex-1 py-2 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600">確認</button>
                    </div>
                  </div>
                </div>
              )}

              {resetTarget && (
                <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-6 z-50">
                  <div className="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full">
                    <h3 className="font-bold text-lg text-gray-800 mb-2">重置 {resetTarget.name} 的密碼</h3>
                    <p className="text-xs text-gray-400 mb-4">重置後學生要用新密碼才能登入，原本的進度和點數都會保留。</p>

                    {resetDoneMsg ? (
                      <>
                        <div className="bg-green-50 text-green-700 text-sm font-bold rounded-xl p-3 mb-4">{resetDoneMsg}</div>
                        <button onClick={() => setResetTarget(null)} className="w-full py-2 bg-gray-100 text-gray-600 rounded-xl font-bold">關閉</button>
                      </>
                    ) : (
                      <>
                        <label className="text-xs font-bold text-gray-400">新密碼 (至少6碼)</label>
                        <input value={resetPassword} onChange={e => setResetPassword(e.target.value)} placeholder="幫學生設一組新密碼" className="w-full p-3 mb-3 border-2 border-gray-200 rounded-xl outline-none" />
                        {resetError && <p className="text-red-500 text-xs mb-3">{resetError}</p>}
                        <div className="flex gap-2">
                          <button onClick={() => setResetTarget(null)} className="flex-1 py-2 bg-gray-100 text-gray-600 rounded-xl font-bold">取消</button>
                          <button
                            disabled={resetBusy || resetPassword.length < 6}
                            onClick={submitResetPassword}
                            className="flex-1 py-2 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 disabled:opacity-50"
                          >
                            {resetBusy ? '處理中...' : '確認重置'}
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        };

        // --- 根元件：處理登入狀態、Firestore 訂閱，並切換到對應畫面 ---
        const Root = () => {
          if (FIREBASE_NOT_CONFIGURED) return <FirebaseNotConfiguredScreen />;

          const [screen, setScreen] = useState('roleSelect'); // roleSelect | studentLogin | teacherLogin
          const [authChecked, setAuthChecked] = useState(false);
          const [role, setRole] = useState(null); // 'student' | 'teacher'
          const [studentProfile, setStudentProfile] = useState(null);
          const [teacherProfile, setTeacherProfile] = useState(null);
          const [totalPoints, setTotalPoints] = useState(0);
          const [classesList, setClassesList] = useState([]);
          const [loginError, setLoginError] = useState('');
          const [busy, setBusy] = useState(false);
          // 只是用來在 curriculumData (模組層級變數) 被老師新增的單字改變後，
          // 強迫整棵元件樹重新 render，讓大家讀到新資料。這個值本身不會被用來
          // 顯示任何東西，純粹是個「重新渲染訊號」。
          const [curriculumVersion, setCurriculumVersion] = useState(0);

          useEffect(() => {
            db.collection('config').doc('classes').onSnapshot(doc => {
              setClassesList((doc.exists && doc.data().names) || []);
            });
          }, []);

          // 老師自訂單字：/customWords/{grade} 文件，每個文件的 topics 欄位是
          // { 單元名稱: [{en,zh}, ...] }。合併進 curriculumData 讓全站自動吃到。
          useEffect(() => {
            const unsub = db.collection('customWords').onSnapshot(snap => {
              const byGrade = {};
              snap.forEach(doc => { byGrade[doc.id] = (doc.data() || {}).topics || {}; });
              curriculumData = mergeCurriculum(BUILTIN_CURRICULUM, byGrade);
              setCurriculumVersion(v => v + 1);
            });
            return () => unsub();
          }, []);

          useEffect(() => {
            // 剛建立帳號 (第一次登入) 時，Firestore 的學生文件是另一個地方 (studentLogin)
            // 才在寫入，這裡訂閱到的第一筆快照有機率比那個寫入還早一步收到「還不存在」，
            // 如果看到「不存在」就馬上登出，會把剛創好帳號的學生立刻踢回登入畫面、
            // 卡在「一直要重打密碼」的迴圈。所以「不存在」時先等一下、重新確認一次，
            // 真的確定帳號被清掉了 (例如老師重置密碼後的舊帳號) 才登出。
            let missingDocTimer = null;

            const unsub = auth.onAuthStateChanged(async (user) => {
              setLoginError('');
              if (!user) {
                setRole(null);
                setStudentProfile(null);
                setTeacherProfile(null);
                setAuthChecked(true);
                return;
              }
              try {
                const teacherDoc = await db.collection('teachers').doc(user.uid).get();
                if (teacherDoc.exists) {
                  setRole('teacher');
                  setTeacherProfile({ id: user.uid, ...teacherDoc.data() });
                  setAuthChecked(true);
                  return;
                }
              } catch (err) {
                // 讀不到 (例如規則還沒發布好、暫時離線) 就先當一般使用者處理，
                // 至少讓畫面能往下跑，不要卡在「載入中」出不去。
              }
              // 訂閱學生資料 (即時更新進度)
              setRole('student');
              db.collection('students').doc(user.uid).onSnapshot(snap => {
                if (snap.exists) {
                  if (missingDocTimer) { clearTimeout(missingDocTimer); missingDocTimer = null; }
                  setStudentProfile({ id: user.uid, ...snap.data() });
                } else if (!missingDocTimer) {
                  missingDocTimer = setTimeout(async () => {
                    missingDocTimer = null;
                    try {
                      const recheck = await db.collection('students').doc(user.uid).get();
                      if (!recheck.exists) {
                        // 確認過還是不存在，這才是真的被清掉了 (通常是老師重置過密碼)，
                        // 強制登出讓學生用新密碼重新登入。
                        setStudentProfile(null);
                        auth.signOut();
                      }
                    } catch (err) {
                      // 重新確認也讀不到就先不要登出，避免暫時性網路問題把人踢出去
                    }
                  }, 1500);
                }
              });
              db.collection('students').doc(user.uid).collection('pointLogs').onSnapshot(snap => {
                let sum = 0;
                snap.forEach(d => { sum += (d.data().delta || 0); });
                setTotalPoints(sum);
              });
              setAuthChecked(true);
            });
            return () => { unsub(); if (missingDocTimer) clearTimeout(missingDocTimer); };
          }, []);

          // 學生登入：先查一下這個「班級+座號」目前對應到哪個帳號
          // (老師如果幫他重置過密碼，會指到一個新帳號)，找不到就用預設的第一組帳號。
          // 接著先試著用輸入的密碼登入；如果失敗，就當作是第一次使用，用同一組
          // 密碼 (加上姓名) 自動建立帳號。如果其實帳號早就存在、只是密碼打錯了，
          // 第二次的建立帳號也會失敗 (email-already-in-use)，這時候才真正顯示「密碼不正確」。
          const studentLogin = async (className, seat, password, name, englishName) => {
            setBusy(true); setLoginError('');
            const seatId = classSeatKey(className, seat);
            let email = classSeatToEmail(className, seat);
            try {
              const pointerDoc = await db.collection('classSeat').doc(seatId).get();
              if (pointerDoc.exists && pointerDoc.data().email) {
                email = pointerDoc.data().email;
              }
            } catch (lookupErr) {
              // 查不到指向資料就用預設帳號繼續嘗試，不擋住登入流程
            }
            try {
              await auth.signInWithEmailAndPassword(email, password);
            } catch (signInErr) {
              try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('students').doc(cred.user.uid).set({
                  name: (name && name.trim()) || `${className} ${seat}號`,
                  englishName: (englishName && englishName.trim()) || '',
                  className, seatNumber: seat, progress: {},
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
              } catch (createErr) {
                if (createErr.code === 'auth/email-already-in-use') {
                  setLoginError('密碼不正確，請再確認一次 (如果忘記密碼，請找老師幫忙重置)');
                } else if (createErr.code === 'auth/weak-password') {
                  setLoginError('密碼至少要 6 個字元');
                } else if (createErr.code === 'auth/operation-not-allowed') {
                  setLoginError('系統尚未設定完成：Firebase 還沒啟用 Email/Password 登入方式，請聯絡管理者到 Authentication → Sign-in method 開啟');
                } else if (createErr.code === 'permission-denied') {
                  setLoginError('系統尚未設定完成：Firestore 安全規則還沒發布或不是最新版，請聯絡管理者到 Firestore Database → 規則 重新發布');
                } else {
                  setLoginError(`登入失敗：請確認班級、座號、密碼是否正確 (錯誤代碼: ${createErr.code || createErr.message || '未知'})`);
                }
              }
            }
            setBusy(false);
          };

          // 老師登入：只有 TEACHER_NAMES 這三個名字可以選，密碼固定同一組。
          // 第一次用某個名字登入時 (該帳號還不存在)，就用這組密碼自動建立帳號。
          const teacherLogin = async (name, password) => {
            setBusy(true); setLoginError('');
            const email = teacherNameToEmail(name);
            try {
              await auth.signInWithEmailAndPassword(email, password);
            } catch (signInErr) {
              if (password !== TEACHER_SHARED_PASSWORD) {
                setLoginError('密碼不正確');
                setBusy(false);
                return;
              }
              try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('teachers').doc(cred.user.uid).set({
                  name, email, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
              } catch (createErr) {
                if (createErr.code === 'auth/operation-not-allowed') {
                  setLoginError('系統尚未設定完成：Firebase 還沒啟用 Email/Password 登入方式，請到 Authentication → Sign-in method 開啟');
                } else if (createErr.code === 'permission-denied') {
                  setLoginError('系統尚未設定完成：Firestore 安全規則還沒發布或不是最新版，請到 Firestore Database → 規則 重新發布 firestore.rules 的內容');
                } else {
                  setLoginError(`登入失敗，請確認密碼是否正確 (錯誤代碼: ${createErr.code || createErr.message || '未知'})`);
                }
              }
            }
            setBusy(false);
          };

          const logout = () => auth.signOut().then(() => setScreen('roleSelect'));

          // 學生完成一個關卡時呼叫：只記錄進度，不自動給點數
          // (點數改由老師「蓋章」核發，見 teacherStampTask)
          // 寫入 progress/mistakes/badges 這幾個背景寫入的動作 (學生自己看不到
          // 有沒有寫成功) 全部包一層 try/catch，寫失敗時在 console 印出清楚的
          // 提示——最常見的原因是 Firestore 安全規則 (firestore.rules) 還沒
          // 重新發布，導致 permission-denied，這種情況下如果沒有這層 log，
          // 畫面上完全看不出任何異狀，只會覺得「這個功能好像沒作用」。
          const logWriteError = (what, err) => {
            console.error(`[nypspassport] 寫入「${what}」失敗:`, err && err.code, err && err.message);
            if (err && err.code === 'permission-denied') {
              console.error('[nypspassport] 很可能是 firestore.rules 還沒在 Firebase Console 重新發布，請確認 Firestore Database → 規則 貼的是最新版本並按「發布」。');
            }
          };

          const onStagePass = async (grade, topic, stage) => {
            if (!studentProfile) return;
            const tKey = topicKey(grade, topic);
            const studentRef = db.collection('students').doc(studentProfile.id);
            try {
              await studentRef.set({
                progress: { [tKey]: { [stage]: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() } }
              }, { merge: true });
            } catch (err) { logWriteError('progress (過關)', err); }
          };

          // 學生一打開某個任務的任何一關 (不管有沒有過關) 就先留一筆紀錄，
          // 讓這個任務馬上出現在老師後台的「進行中」列表、也讓學生自己在
          // 選單上看得到「進行中」，不用等到真的過關才會被看到。
          const onTopicStart = async (grade, topic) => {
            if (!studentProfile) return;
            const tKey = topicKey(grade, topic);
            const studentRef = db.collection('students').doc(studentProfile.id);
            try {
              await studentRef.set({
                progress: { [tKey]: { updatedAt: firebase.firestore.FieldValue.serverTimestamp() } }
              }, { merge: true });
            } catch (err) { logWriteError('progress (開始練習)', err); }
          };

          // 學生答錯聽力/閱讀測驗題目時，記錄到 mistakes 欄位 (錯題本)；
          // 之後在「加強練習」複習答對了，再用 onClearMistake 把這一題移除。
          const onMistake = async (grade, topic, item, stage) => {
            if (!studentProfile) return;
            const key = mistakeKey(grade, topic, item.en);
            const studentRef = db.collection('students').doc(studentProfile.id);
            try {
              await studentRef.set({
                mistakes: {
                  [key]: {
                    grade, topic, en: item.en, zh: item.zh, stage,
                    count: firebase.firestore.FieldValue.increment(1),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                  }
                }
              }, { merge: true });
            } catch (err) { logWriteError('mistakes (錯題本)', err); }
          };

          const onClearMistake = async (key) => {
            if (!studentProfile || !key) return;
            const studentRef = db.collection('students').doc(studentProfile.id);
            try {
              await studentRef.set({
                mistakes: { [key]: firebase.firestore.FieldValue.delete() }
              }, { merge: true });
            } catch (err) { logWriteError('mistakes (移除錯題)', err); }
          };

          // 事件型徽章：目前只有「挑戰達人」用到，發生過一次
          // 就記錄下來，arrayUnion 本身就有防重複的效果，重複呼叫也不會出現兩次。
          const onBadgeEarn = async (badgeId) => {
            if (!studentProfile || !badgeId) return;
            const studentRef = db.collection('students').doc(studentProfile.id);
            try {
              await studentRef.set({
                badges: firebase.firestore.FieldValue.arrayUnion(badgeId)
              }, { merge: true });
            } catch (err) { logWriteError('badges (徽章)', err); }
          };

          const teacherAddClass = (name) => {
            db.collection('config').doc('classes').set({
              names: firebase.firestore.FieldValue.arrayUnion(name)
            }, { merge: true });
          };

          // 老師新增自訂單字：可以加到既有單元 (topic 名稱打得跟現有的一樣)，
          // 也可以直接打一個新的單元名稱來建立全新單元。
          const teacherAddCustomWord = async (grade, topic, en, zh) => {
            await db.collection('customWords').doc(grade).set({
              topics: {
                [topic]: firebase.firestore.FieldValue.arrayUnion({ en: en.trim(), zh: zh.trim() })
              }
            }, { merge: true });
          };

          const teacherAddStudent = async (className, seat, name, pin) => {
            const email = classSeatToEmail(className, seat);
            const cred = await secondaryAuth.createUserWithEmailAndPassword(email, pin);
            const uid = cred.user.uid;
            await secondaryAuth.signOut();
            await db.collection('students').doc(uid).set({
              name, className, seatNumber: seat, progress: {},
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          };

          // 老師蓋章：一個任務(單元)六關全過後，老師點擊蓋章給 5 點，
          // 每個任務只能蓋一次章。
          const teacherStampTask = async (studentId, tKey, grade, topic, teacherName) => {
            const studentRef = db.collection('students').doc(studentId);
            await studentRef.set({
              progress: {
                [tKey]: {
                  stamped: true,
                  stampedBy: teacherName,
                  stampedAt: firebase.firestore.FieldValue.serverTimestamp(),
                }
              }
            }, { merge: true });
            await studentRef.collection('pointLogs').add({
              delta: TASK_STAMP_POINTS,
              reason: `🎉 蓋章任務：${grade} - ${topic}`,
              source: 'teacher', by: teacherName, topicKey: tKey,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          };

          // 老師手動幫學生過「口說」關：麥克風常常誤判，學生唸給老師聽、
          // 老師確認發音沒問題之後，就用這個直接把口說關標記成通過，
          // 不用真的靠麥克風偵測，下一關 (配對) 就會跟著解鎖。
          const teacherOverrideSpeak = async (studentId, tKey, teacherName) => {
            const studentRef = db.collection('students').doc(studentId);
            await studentRef.set({
              progress: {
                [tKey]: {
                  speak: true,
                  speakOverriddenBy: teacherName,
                  speakOverriddenAt: firebase.firestore.FieldValue.serverTimestamp(),
                }
              }
            }, { merge: true });
          };

          // 老師額外加點/扣點 (蓋章以外的彈性加點，例如課堂表現)
          const teacherAwardPoints = async (studentId, delta, reason, teacherName) => {
            await db.collection('students').doc(studentId).collection('pointLogs').add({
              delta: Number(delta),
              reason: reason || '老師加點',
              source: 'teacher', by: teacherName,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          };

          // 老師幫學生重置密碼。
          // Firebase 沒有辦法讓老師直接「修改」另一個人的密碼，所以實際做法是：
          // 幫學生用「新版本的帳號」建立一組新密碼，把原本的姓名/進度/點數紀錄
          // 都搬過去，並更新 classSeat 指向資料，這樣學生下次用同一個班級+座號
          // 登入時，系統會自動改用這個新帳號比對密碼。原本的舊帳號資料會被清掉。
          const teacherResetPassword = async (student, newPassword) => {
            const seatId = classSeatKey(student.className, student.seatNumber);
            const newEmail = classSeatToEmail(student.className, student.seatNumber, Date.now());

            const cred = await secondaryAuth.createUserWithEmailAndPassword(newEmail, newPassword);
            const newUid = cred.user.uid;
            await secondaryAuth.signOut();

            const oldRef = db.collection('students').doc(student.id);
            const newRef = db.collection('students').doc(newUid);

            await newRef.set({
              name: student.name,
              englishName: student.englishName || '',
              className: student.className,
              seatNumber: student.seatNumber,
              progress: student.progress || {},
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });

            // 把舊帳號的點數紀錄搬到新帳號，保留原本的加點/蓋章歷史
            const oldLogsSnap = await oldRef.collection('pointLogs').get();
            const copyBatch = db.batch();
            oldLogsSnap.forEach(doc => {
              copyBatch.set(newRef.collection('pointLogs').doc(doc.id), doc.data());
            });
            await copyBatch.commit();

            // 更新指向資料，之後這個班級+座號登入都會改用新帳號
            await db.collection('classSeat').doc(seatId).set({
              email: newEmail, name: student.name,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            });

            // 刪掉舊帳號的學生資料 (progress/名字等)，避免後台看到重複的人。
            // 舊的點數紀錄 (pointLogs) 依規則是「只能新增、不能刪除」的流水帳，
            // 所以會留在舊帳號底下，但因為舊帳號沒有 Firestore 學生資料、也沒有
            // 人知道密碼了，這些留下來的舊紀錄不會再被任何人讀到或用到。
            await oldRef.delete();
          };

          if (!authChecked) {
            return (
              <div className="min-h-screen bg-sky-50 flex items-center justify-center">
                <p className="text-sky-400 font-bold animate-pulse">載入中...</p>
              </div>
            );
          }

          if (role === 'teacher' && teacherProfile) {
            return (
              <TeacherDashboard
                teacherName={teacherProfile.name}
                classesList={mergeClasses(classesList)}
                onAddClass={teacherAddClass}
                onAddStudent={teacherAddStudent}
                onStampTask={teacherStampTask}
                onAwardPoints={teacherAwardPoints}
                onResetPassword={teacherResetPassword}
                onOverrideSpeak={teacherOverrideSpeak}
                onAddCustomWord={teacherAddCustomWord}
                onExit={logout}
              />
            );
          }

          if (role === 'student' && studentProfile) {
            return (
              <LearningApp
                studentId={studentProfile.id}
                studentName={studentProfile.name}
                englishName={studentProfile.englishName || ''}
                className={studentProfile.className}
                seatNumber={studentProfile.seatNumber}
                progress={studentProfile.progress || {}}
                totalPoints={totalPoints}
                mistakes={studentProfile.mistakes || {}}
                badges={studentProfile.badges || []}
                onStagePass={onStagePass}
                onMistake={onMistake}
                onClearMistake={onClearMistake}
                onBadgeEarn={onBadgeEarn}
                onTopicStart={onTopicStart}
                onExit={logout}
              />
            );
          }

          if (screen === 'studentLogin') {
            return <StudentLoginScreen classesList={classesList} onLogin={studentLogin} onBack={() => setScreen('roleSelect')} error={loginError} busy={busy} />;
          }
          if (screen === 'teacherLogin') {
            return <TeacherLoginScreen onLogin={teacherLogin} onBack={() => setScreen('roleSelect')} error={loginError} busy={busy} />;
          }
          return <RoleSelectScreen onPick={(r) => setScreen(r === 'student' ? 'studentLogin' : 'teacherLogin')} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
